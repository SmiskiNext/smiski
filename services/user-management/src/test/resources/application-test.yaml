spring:
    jpa:
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
        enabled: true
        locations: classpath:db/migration

app:
    jwt:
        secret: integration-test-secret-key-must-be-at-least-64-chars-for-hs512-algorithm-requirement
        access-token-expiry-seconds: 900
        refresh-token-expiry-seconds: 2592000
    cursor:
        secret: test-cursor-secret-fixed-value-for-tests
    firebase:
        project-id:
        credentials-path:
