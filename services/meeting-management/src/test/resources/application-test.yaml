spring:
    jpa:
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
        enabled: true
        locations: classpath:db/migration

app:
    cursor:
        secret: test-cursor-secret-fixed-value-for-tests

zms:
    invite:
        use-tokens: true
