openapi: 3.1.0
info:
  title: Smiski API
  version: 1.0.0
  description: Unified API surface across tenant, meet, and record services.
servers:
  - url: http://localhost:8080
    description: API Gateway
tags:
  - name: tenant-controller
    description: 'Tenant lifecycle: register (install) and uninstall Forge app tenants'
    x-displayName: tenant-controller
  - name: livekit-webhook-controller
    description: Receives LiveKit server webhooks
    x-displayName: livekit-webhook-controller
  - name: meeting-controller
    description: 'Meeting lifecycle: schedule, create instant, update, list, delete meetings and manage invitees'
    x-displayName: meeting-controller
paths:
  /api/{version}/tenants:
    post:
      tags:
        - tenant-controller
      summary: Register a tenant
      description: Registers a new tenant installation or acknowledges a reinstall/redelivery. Returns 201 on first install with a Location header, 200 on reinstall.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tenant_RegisterTenantRequest'
        required: true
      responses:
        '200':
          description: Tenant already exists (reinstall/redelivery)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant_TenantResponse'
              examples:
                reinstall:
                  description: reinstall
                  value:
                    installationId: install-new-789
                    appId: app-1
                    appVersion: 2.0.0
                    environmentId: null
                    siteUrl: null
                    installerAccountId: null
                    status: ACTIVE
                    installedAt: '2025-01-15T10:30:00Z'
                    updatedAt: '2025-06-15T10:30:00Z'
                    uninstalledAt: null
                    purgeAfter: null
        '201':
          description: Tenant registered (first install)
          headers:
            Location:
              description: URI of the newly created tenant resource
              style: simple
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant_TenantResponse'
              examples:
                created:
                  description: created
                  value:
                    installationId: install-xyz-456
                    appId: app-1
                    appVersion: 1.0.0
                    environmentId: env-1
                    siteUrl: https://example.atlassian.net
                    installerAccountId: installer-1
                    status: ACTIVE
                    installedAt: '2025-01-15T10:30:00Z'
                    updatedAt: '2025-01-15T10:30:00Z'
                    uninstalledAt: null
                    purgeAfter: null
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Tenant_ProblemDetail'
              examples:
                validationError:
                  summary: Validation failure
                  description: validationError
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: The request body failed validation
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
                    errors:
                      - field: id
                        code: REQUIRED
                        message: must not be blank
                malformedRequest:
                  summary: Malformed JSON body
                  description: malformedRequest
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: The request body could not be read
                    code: MALFORMED_REQUEST
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
                missingTenantContext:
                  summary: Missing X-Tenant-ID header
                  description: missingTenantContext
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Tenant context is required but was not provided
                    code: MISSING_TENANT_CONTEXT
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        '405':
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Tenant_ProblemDetail'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Tenant_ProblemDetail'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Tenant_ProblemDetail'
    delete:
      tags:
        - tenant-controller
      summary: Uninstall a tenant
      description: Records a Forge app uninstall. Marks the tenant as UNINSTALLED and schedules purge. Idempotent for already-uninstalled tenants.
      operationId: uninstall
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tenant_UninstallTenantRequest'
      responses:
        '200':
          description: Tenant uninstalled (or already uninstalled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant_UninstallTenantResponse'
              examples:
                uninstalled:
                  description: uninstalled
                  value:
                    installationId: install-xyz-456
                    appId: app-1
                    appVersion: 1.0.0
                    environmentId: null
                    siteUrl: null
                    installerAccountId: null
                    status: UNINSTALLED
                    installedAt: '2025-01-15T10:30:00Z'
                    updatedAt: '2025-06-15T10:30:00Z'
                    uninstalledAt: '2025-06-15T10:30:00Z'
                    purgeAfter: '2025-07-15T10:30:00Z'
        '400':
          description: Missing tenant context
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Tenant_ProblemDetail'
              examples:
                missingTenantContext:
                  description: missingTenantContext
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Tenant context is required but was not provided
                    code: MISSING_TENANT_CONTEXT
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        '404':
          description: Tenant not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Tenant_ProblemDetail'
              examples:
                notFound:
                  description: notFound
                  value:
                    type: about:blank
                    title: Tenant Not Found
                    status: 404
                    detail: No tenant exists for the given cloud ID
                    code: TENANT_NOT_FOUND
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        '405':
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Tenant_ProblemDetail'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Tenant_ProblemDetail'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Tenant_ProblemDetail'
    parameters:
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: 1
  /api/{version}/meetings/{id}:
    get:
      tags:
        - meeting-controller
      summary: Get a meeting with its people
      description: Returns a single meeting in the caller's tenant together with its active invitee list and its distinct joined-participant list. Any authenticated tenant member may read the meeting; access is not restricted to the host.
      operationId: get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Meeting detail with invitees and participants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meet_GetMeetingResponse'
              examples:
                detail:
                  description: detail
                  value:
                    meeting:
                      id: 0195e0c2-8f3a-7c21-b9d4-2f1a6e7c8d90
                      hostId: account-123
                      shortCode: abc-defg-hij
                      type: SCHEDULED
                      status: SCHEDULED
                      title: Sprint planning
                      description: Plan the next sprint
                      issueLink:
                        issueId: '10001'
                        issueKey: PROJ-1
                        projectKey: PROJ
                      settings:
                        admissionPolicy: MANUAL_APPROVAL
                        maxParticipants: 50
                        allowScreenShare: true
                        chatEnabled: true
                        allowMicrophone: true
                        allowVideo: true
                      startTime: '2025-02-01T14:00:00Z'
                      endTime: '2025-02-01T15:00:00Z'
                      zoneId: Asia/Ho_Chi_Minh
                      organizerEmail: host@example.com
                      organizerDisplayName: Host User
                      calendarUid: meeting-0195e0c2@smiski.app
                      calendarSequence: 1
                      createdAt: '2025-01-15T10:30:00Z'
                    invitees:
                      - accountId: account-456
                        email: alice@example.com
                        displayName: Alice Nguyen
                        status: ACCEPTED
                        invitedAt: '2025-01-15T10:35:00Z'
                        respondedAt: '2025-01-15T11:00:00Z'
                    participants:
                      - accountId: account-456
                        role: PARTICIPANT
                        joinedAt: '2025-02-01T14:01:00Z'
                        leftAt: null
        '400':
          description: Missing account header
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
              examples:
                missingAccount:
                  description: missingAccount
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: X-Account-Id header is required
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        '404':
          description: Meeting not found, soft-deleted, or in another tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
              examples:
                notFound:
                  description: notFound
                  value:
                    type: about:blank
                    title: Meeting not found
                    status: 404
                    detail: No meeting matches the given identifier.
                    code: MEETING_NOT_FOUND
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        '405':
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
    put:
      tags:
        - meeting-controller
      summary: Update a meeting
      description: Updates a meeting as its host. Information and settings are mutable while scheduled or running; scheduled details are mutable only while scheduled.
      operationId: update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Meet_UpdateMeetingRequest'
        required: true
      responses:
        '200':
          description: Meeting updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meet_UpdateMeetingResponse'
              examples:
                updated:
                  description: updated
                  value:
                    meeting:
                      id: 0195e0c2-8f3a-7c21-b9d4-2f1a6e7c8d90
                      hostId: account-123
                      shortCode: abc-defg-hij
                      type: SCHEDULED
                      status: SCHEDULED
                      title: Sprint planning
                      description: Plan the next sprint
                      issueLink:
                        issueId: '10001'
                        issueKey: PROJ-1
                        projectKey: PROJ
                      settings:
                        admissionPolicy: ALLOW_ALL
                        maxParticipants: 50
                        allowScreenShare: true
                        chatEnabled: true
                        allowMicrophone: true
                        allowVideo: true
                      startTime: '2025-02-01T14:00:00Z'
                      endTime: '2025-02-01T15:00:00Z'
                      zoneId: Asia/Ho_Chi_Minh
                      organizerEmail: host@example.com
                      organizerDisplayName: Host User
                      calendarUid: meeting-0195e0c2@smiski.app
                      calendarSequence: 1
                      createdAt: '2025-01-15T10:30:00Z'
        '400':
          description: Validation error or missing account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
              examples:
                validationError:
                  summary: Validation failure
                  description: validationError
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: The request body failed validation
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
                    errors:
                      - field: title
                        code: REQUIRED
                        message: must not be blank
                missingAccount:
                  summary: Missing X-Account-Id header
                  description: missingAccount
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: X-Account-Id header is required
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        '403':
          description: Only the host may update the meeting
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
              examples:
                notOwner:
                  description: notOwner
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    detail: Only the host may update the meeting
                    code: NOT_OWNER
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        '404':
          description: Meeting not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
              examples:
                notFound:
                  description: notFound
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    detail: Meeting not found
                    code: MEETING_NOT_FOUND
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        '405':
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
    delete:
      tags:
        - meeting-controller
      summary: Delete a meeting
      description: Soft-deletes a meeting as its host. Running meetings must be ended first, and already-deleted meetings are treated as not found.
      operationId: delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Meeting deleted; returns the deleted meeting snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meet_DeleteMeetingResponse'
        '400':
          description: Missing account header
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
              examples:
                missingAccount:
                  description: missingAccount
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: X-Account-Id header is required
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        '403':
          description: Only the host may delete the meeting
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
              examples:
                notAuthorized:
                  description: notAuthorized
                  value:
                    type: about:blank
                    title: Not authorized
                    status: 403
                    detail: You are not the host of this meeting.
                    code: NOT_AUTHORIZED
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        '404':
          description: Meeting not found or already deleted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
              examples:
                notFound:
                  description: notFound
                  value:
                    type: about:blank
                    title: Meeting not found
                    status: 404
                    detail: No meeting matches the given identifier.
                    code: MEETING_NOT_FOUND
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        '405':
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
        '409':
          description: The meeting is running and cannot be deleted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
              examples:
                running:
                  description: running
                  value:
                    type: about:blank
                    title: Cannot delete a running meeting
                    status: 409
                    detail: The meeting is running and must be ended before deletion.
                    code: CANNOT_DELETE_RUNNING_MEETING
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
    parameters:
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: 1
  /api/{version}/meetings/{id}/invitees:
    put:
      tags:
        - meeting-controller
      summary: Replace a meeting's invitee list
      description: 'Replaces the full invitee list of a SCHEDULED meeting as its host. Invitees are matched by accountId: new entries are created, existing entries have their display name updated, and absent entries are removed.'
      operationId: updateInvitees
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Meet_UpdateMeetingInviteesRequest'
        required: true
      responses:
        '200':
          description: Invitees synchronized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meet_UpdateMeetingInviteesResponse'
              examples:
                synchronized:
                  description: synchronized
                  value:
                    invitees:
                      - id: 0195e0c2-8f3a-7c21-b9d4-3a2b1c4d5e60
                        accountId: account-456
                        email: alice@example.com
                        displayName: Alice Nguyen
                        role: PARTICIPANT
                        status: PENDING
                        invitedAt: '2025-01-15T10:35:00Z'
                        respondedAt: null
                      - id: 0195e0c2-8f3a-7c21-b9d4-4b3c2d5e6f70
                        accountId: account-789
                        email: bob@example.com
                        displayName: Bob Tran
                        role: PARTICIPANT
                        status: ACCEPTED
                        invitedAt: '2025-01-15T10:35:00Z'
                        respondedAt: '2025-01-15T11:00:00Z'
        '400':
          description: Validation error or missing account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
              examples:
                validationError:
                  summary: Validation failure
                  description: validationError
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: The request body failed validation
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
                    errors:
                      - field: invitees[0].email
                        code: INVALID_FORMAT
                        message: must be a well-formed email address
                missingAccount:
                  summary: Missing X-Account-Id header
                  description: missingAccount
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: X-Account-Id header is required
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        '403':
          description: Only the host may modify invitees
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
              examples:
                notOwner:
                  description: notOwner
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    detail: Only the host may modify invitees
                    code: NOT_OWNER
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        '404':
          description: Meeting not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
              examples:
                notFound:
                  description: notFound
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    detail: Meeting not found
                    code: MEETING_NOT_FOUND
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        '405':
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
    parameters:
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: 1
  /api/{version}/webhooks/livekit:
    post:
      tags:
        - livekit-webhook-controller
      summary: Receive a LiveKit webhook
      description: Verifies the LiveKit signed-JWT payload against the raw body and enqueues the decoded event for asynchronous processing.
      operationId: receive
      parameters:
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/webhook+json:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Signature valid; event accepted
        '400':
          description: Body could not be decoded
        '401':
          description: Missing or invalid signature
        '405':
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
    parameters:
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: 1
  /api/{version}/meetings:
    post:
      tags:
        - meeting-controller
      summary: List tenant meetings
      description: Lists meetings in the caller's tenant with optional creator, status, issue, and text filters, two sort modes, and opaque keyset pagination. The request body is optional; an empty body lists with defaults.
      operationId: list
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Meet_ListMeetingsRequest'
      responses:
        '200':
          description: Page of tenant meetings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meet_MeetingListPage'
              examples:
                page:
                  description: page
                  value:
                    data:
                      - id: 0195e0c2-8f3a-7c21-b9d4-2f1a6e7c8d90
                        hostId: account-123
                        shortCode: abc-defg-hij
                        title: Sprint planning
                        description: Plan the next sprint
                        issueKey: SMISKI-102
                        type: SCHEDULED
                        status: SCHEDULED
                        startTime: '2025-02-01T14:00:00Z'
                        endTime: '2025-02-01T15:00:00Z'
                        createdAt: '2025-01-15T10:30:00Z'
                        settings:
                          admissionPolicy: MANUAL_APPROVAL
                          maxParticipants: 50
                          allowScreenShare: true
                          chatEnabled: true
                          allowMicrophone: true
                          allowVideo: true
                    meta:
                      size: 1
                      hasNext: true
                      nextPageToken: Uy5leUov...
        '400':
          description: Missing account header, page-size validation, or invalid cursor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Meet_ProblemDetail'
              examples:
                invalidCursor:
                  summary: Invalid or sort-mismatched page token
                  description: invalidCursor
                  value:
                    type: about:blank
                    title: Invalid page cursor
                    status: 400
                    detail: The page cursor is invalid; restart from the first page.
                    code: INVALID_CURSOR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
                missingAccount:
                  summary: Missing X-Account-Id header
