        meeting:
          $ref: '#/components/schemas/Meet_DeletedMeetingSnapshot'
    Notification_JoinRequestApprovedData:
      type: object
      description: Payload of the join_request_approved SSE event delivered to the requester
      properties:
        token:
          type: string
          description: LiveKit access token for connecting to the meeting room
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.token
        roomName:
          type: string
          description: LiveKit room name to connect to
          example: room-018f4e2a
    Notification_JoinRequestDeniedData:
      type: object
      description: Payload of the join_request_denied SSE event delivered to the requester
      properties:
        reason:
          type:
            - string
            - 'null'
          description: Machine-readable denial reason; null when no reason is provided
    Notification_SseEmitter:
      type: object
      properties:
        timeout:
          type: integer
          format: int64
    Notification_JoinRequestCreatedData:
      type: object
      description: Payload of the join_request_created SSE event delivered to the meeting host
      properties:
        requestId:
          type: string
          description: Identifier of the join request
          example: 018f4e2a-1b3c-7d8e-9f0a-1b2c3d4e5f6a
        accountId:
          type: string
          description: Account identifier of the requester
          example: 018f4e2a-0000-7d8e-9f0a-1b2c3d4e5f6a
        displayName:
          type: string
          description: Display name provided by the requester
          example: Alice
        avatarUrl:
          type:
            - string
            - 'null'
          description: Avatar URL provided by the requester; null when not supplied
    Notification_ProblemDetail:
      description: RFC 9457 Problem Details response body
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
          example: about:blank
        title:
          type: string
          description: Short human-readable summary of the problem
          example: Bad Request
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          example: The request body failed validation
        code:
          type: string
          description: Machine-readable error code
          example: VALIDATION_ERROR
        traceId:
          type: string
          description: Distributed trace identifier for correlation
          example: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        errors:
          type: array
          description: Field-level validation errors (present when code is VALIDATION_ERROR)
          items:
            $ref: '#/components/schemas/Notification_Violation'
    Notification_Violation:
      description: Field-level validation error
      properties:
        field:
          type: string
          description: Request field that failed validation
          example: app.id
        code:
          type: string
          description: Machine-readable violation category
          enum:
            - REQUIRED
            - INVALID_FORMAT
            - TOO_SHORT
            - TOO_LONG
            - INVALID_VALUE
          example: REQUIRED
        message:
          type: string
          description: Server-localized human-readable message
          example: must not be blank
x-tagGroups:
  - name: Tenant
    tags:
      - tenant-controller
  - name: Meet
    tags:
      - livekit-webhook-controller
      - meeting-controller
  - name: Notification
    tags:
      - meeting-events-controller
      - resend-inbound-webhook-controller
