  /api/{version}/meetings/{id}/join-requests/{requestId}/events:
    get:
      tags:
        - meeting-events-controller
      summary: Subscribe to a join request's decision
      description: 'Opens a text/event-stream connection scoped by request id that delivers the host''s accept/decline outcome as a join_request_approved (token, roomName) or join_request_denied (reason) event, replays a decision already recorded before subscribe, and sends periodic heartbeat comments (`: ka`) until the configured timeout. Each event is sent as an SSE frame with an `event:` line (either `join_request_approved` or `join_request_denied`) followed by a `data:` line containing the JSON payload described in the schema.'
      operationId: subscribeRequest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SSE stream opened; decision delivered over text/event-stream
          content:
            text/event-stream:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Notification_JoinRequestApprovedData'
                  - $ref: '#/components/schemas/Notification_JoinRequestDeniedData'
              examples:
                joinRequestApproved:
                  summary: Host approved; token + room delivered
                  description: joinRequestApproved
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.token
                    roomName: room-018f4e2a
                joinRequestDenied:
                  summary: Host declined; optional reason, never a token
                  description: joinRequestDenied
                  value:
                    reason: HOST_DECLINED
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification_ProblemDetail'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification_ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Notification_SseEmitter'
    parameters:
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: 1
  /api/{version}/meetings/{id}/events:
    get:
      tags:
        - meeting-events-controller
      summary: Subscribe to a meeting's join events
      description: 'Opens a text/event-stream connection that delivers join_request_created events for the meeting, replays currently pending requests on subscribe, and sends periodic heartbeat comments (`: ka`) until the configured timeout. Each event is sent as an SSE frame with an `event: join_request_created` line followed by a `data:` line containing the JSON payload described in the schema.'
      operationId: subscribe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SSE stream opened; events delivered over text/event-stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Notification_JoinRequestCreatedData'
              examples:
                joinRequestCreated:
                  summary: A new join request arrived
                  description: joinRequestCreated
                  value:
                    requestId: 018f4e2a-1b3c-7d8e-9f0a-1b2c3d4e5f6a
                    accountId: 018f4e2a-0000-7d8e-9f0a-1b2c3d4e5f6a
                    displayName: Alice
                    avatarUrl: null
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification_ProblemDetail'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification_ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Notification_SseEmitter'
    parameters:
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: 1
components:
  schemas:
    Tenant_App:
      type: object
      description: Application metadata for the installation
      properties:
        id:
          type: string
          description: Unique application identifier
          example: app-1
          minLength: 1
        version:
          type: string
          description: Application version
          example: 1.0.0
        name:
          type:
            - string
            - 'null'
          description: Human-readable application name
          example: My App
        ownerAccountId:
          type:
            - string
            - 'null'
          description: Account ID of the application owner
          example: owner-abc-123
      required:
        - id
        - version
    Tenant_Environment:
      type: object
      description: Environment context for the installation
      properties:
        id:
          type:
            - string
            - 'null'
          description: Environment identifier
          example: env-prod-1
    Tenant_RegisterTenantRequest:
      type: object
      description: Request body for registering a tenant installation
      properties:
        id:
          type: string
          description: Unique installation identifier
          example: install-xyz-456
          minLength: 1
        installerAccountId:
          type:
            - string
            - 'null'
          description: Account ID of the user who installed the app
          example: account-abc-123
        app:
          $ref: '#/components/schemas/Tenant_App'
        environment:
          type: 'null'
          $ref: '#/components/schemas/Tenant_Environment'
        siteUrl:
          type:
            - string
            - 'null'
          description: Base URL of the Atlassian site
          example: https://mysite.atlassian.net
      required:
        - app
        - id
    Tenant_TenantResponse:
      type: object
      description: Tenant registration result
      properties:
        installationId:
          type: string
          description: Installation identifier
          example: install-xyz-456
        appId:
          type: string
          description: Application identifier
          example: app-1
        appVersion:
          type:
            - string
            - 'null'
          description: Application version
          example: 1.0.0
        environmentId:
          type:
            - string
            - 'null'
          description: Environment identifier
          example: env-1
        siteUrl:
          type:
            - string
            - 'null'
          description: Atlassian site URL
          example: https://example.atlassian.net
        installerAccountId:
          type:
            - string
            - 'null'
          description: Account ID of the installer
          example: installer-1
        status:
          type: string
          description: Current tenant status
          enum:
            - ACTIVE
            - SUSPENDED
            - UNINSTALLED
          example: ACTIVE
        installedAt:
          type: string
          format: date-time
          description: Timestamp of initial installation
          example: '2025-01-15T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of last update
          example: '2025-01-15T10:30:00Z'
        uninstalledAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp when the tenant was uninstalled
          example: '2025-06-15T10:30:00Z'
        purgeAfter:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp after which tenant data may be purged
          example: '2025-07-15T10:30:00Z'
    Tenant_Violation:
      type: object
      description: Field-level validation error
      properties:
        field:
          type: string
          description: Request field that failed validation
          example: app.id
        code:
          type: string
          description: Machine-readable violation category
          enum:
            - REQUIRED
            - INVALID_FORMAT
            - TOO_SHORT
            - TOO_LONG
            - INVALID_VALUE
          example: REQUIRED
        message:
          type:
            - string
            - 'null'
          description: Server-localized human-readable message
          example: must not be blank
    Tenant_ProblemDetail:
      type: object
      description: RFC 9457 Problem Details response body
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
          example: about:blank
        title:
          type: string
          description: Short human-readable summary of the problem
          example: Bad Request
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          example: The request body failed validation
        code:
          type: string
          description: Machine-readable error code
          example: VALIDATION_ERROR
        traceId:
          type: string
          description: Distributed trace identifier for correlation
          example: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        errors:
          type: array
          description: Field-level validation errors (present when code is VALIDATION_ERROR)
          items:
            $ref: '#/components/schemas/Tenant_Violation'
