services:
    user-postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${USER_POSTGRES_DB:-zms_users}
            POSTGRES_USER: ${POSTGRES_USER:-zms_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zms_secret}
        ports:
            - '8281:5432'
        volumes:
            - user-postgres-data:/var/lib/postgresql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 10s
            timeout: 5s
            retries: 10

    meeting-postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${MEETING_POSTGRES_DB:-zms_meetings}
            POSTGRES_USER: ${POSTGRES_USER:-zms_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zms_secret}
        ports:
            - '8282:5432'
        volumes:
            - meeting-postgres-data:/var/lib/postgresql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 10s
            timeout: 5s
            retries: 10

    chat-mongo:
        image: mongo:7.0-jammy
        command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
        ports:
            - '8283:27017'
        volumes:
            - chat-mongo-data:/data/db
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' |
                    grep 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 10

    chat-mongo-init:
        image: mongo:7.0-jammy
        depends_on:
            chat-mongo:
                condition: service_healthy
        command:
            - bash
            - -c
            - |
                mongosh --host chat-mongo:27017 --quiet --eval '
                  try { rs.status().ok } catch (e) {
                    rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "chat-mongo:27017" }] })
                  }
                ' && touch /tmp/init-done && tail -f /dev/null
        restart: 'no'
        healthcheck:
            test: ['CMD-SHELL', 'test -f /tmp/init-done']
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 5s

    chat-flyway-migrate:
        image: redgate/flyway:12.6-alpine-mongo
        depends_on:
            chat-mongo-init:
                condition: service_healthy
        environment:
            FLYWAY_URL: 'mongodb://chat-mongo:27017/chat_management?replicaSet=rs0&directConnection=true'
            FLYWAY_LOCATIONS: 'filesystem:/flyway/sql'
            FLYWAY_SQL_MIGRATION_SUFFIXES: '.js'
            FLYWAY_BASELINE_ON_MIGRATE: 'true'
            FLYWAY_CONNECT_RETRIES: '30'
        command: ['migrate']
        volumes:
            - ../chat-management/src/main/resources/db/migration:/flyway/sql:ro
        restart: 'no'

    kafka:
        image: apache/kafka:latest
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports:
            - '9094:9094'
        volumes:
            - kafka-data:/var/lib/kafka/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    '/opt/kafka/bin/kafka-broker-api-versions.sh
                    --bootstrap-server localhost:9092 >/dev/null 2>&1',
                ]
            interval: 10s
            timeout: 10s
            retries: 12

    valkey:
        image: valkey/valkey:8-alpine
        ports:
            - '8284:6379'
        volumes:
            - valkey-data:/data
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 10

    rustfs:
        image: rustfs/rustfs:latest
        environment:
            RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfs-access-key}
            RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfs-secret-key-change-me}
        command: server /data --console-address :9001
        ports:
            - '9000:9000'
            - '30001:9001'
        volumes:
            - rustfs-data:/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q --spider http://localhost:9000/health || exit 1',
                ]
            interval: 10s
            timeout: 5s
            retries: 10

    livekit-redis:
        image: redis:8-alpine
        volumes:
            - livekit-redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 10

    livekit-server:
        image: livekit/livekit-server:latest
        command:
            - '--config'
            - '/etc/livekit/livekit.yaml'
            - '--node-ip'
            - '${ZMS_HOST_IP}'
        environment:
            ZMS_HOST_IP:
                ${ZMS_HOST_IP:?set ZMS_HOST_IP in services/docker/.env to your
                host LAN IP (LiveKit advertises this IP in ICE candidates)}
        ports:
            - '7880:7880'
            - '7881:7881'
            - '7882:7882/udp'
        configs:
            - source: livekit_server_config
              target: /etc/livekit/livekit.yaml
        depends_on:
            livekit-redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q --spider http://localhost:7880 || exit 1',
                ]
            interval: 10s
            timeout: 5s
            retries: 10

    livekit-egress:
        image: livekit/egress:latest
        environment:
            EGRESS_CONFIG_FILE: /etc/livekit/egress.yaml
        configs:
            - source: livekit_egress_config
              target: /etc/livekit/egress.yaml
        depends_on:
            livekit-redis:
                condition: service_healthy
            rustfs:
                condition: service_healthy

    rustfs-init-buckets:
        image: minio/mc:latest
        depends_on:
            rustfs:
                condition: service_healthy
        entrypoint: ['/bin/sh', '-c']
        command: >
            "mc alias set rustfs http://rustfs:9000 $${RUSTFS_ACCESS_KEY}
            $${RUSTFS_SECRET_KEY} && mc mb --ignore-existing
            rustfs/$${RUSTFS_BUCKET} && touch /tmp/init-done && tail -f
            /dev/null"
        environment:
            RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfs-access-key}
            RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfs-secret-key-change-me}
            RUSTFS_BUCKET: ${RUSTFS_BUCKET:-recordings}
        restart: 'no'
        healthcheck:
            test: ['CMD-SHELL', 'test -f /tmp/init-done']
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 5s

    caddy:
        build:
            context: ./caddy
        environment:
            JWT_SECRET_BASE64:
                ${JWT_SECRET_BASE64:?set JWT_SECRET_BASE64 in .env to base64 of
                JWT_SECRET}
            ZMS_HOST_IP:
                ${ZMS_HOST_IP:?set ZMS_HOST_IP in services/docker/.env to your
                host LAN IP (rootless Docker cannot reach host loopback)}
        ports:
            - '30000:80'
        volumes:
            - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        depends_on:
            livekit-server:
                condition: service_healthy

configs:
    livekit_server_config:
        content: |
            port: 7880
            bind_addresses:
                - 0.0.0.0
            rtc:
                tcp_port: 7881
                use_external_ip: false
                udp_port: 7882
            redis:
                address: livekit-redis:6379
            keys:
                ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
            webhook:
                api_key: ${LIVEKIT_API_KEY}
                urls:
                    - ${LIVEKIT_WEBHOOK_URL}
            logging:
                level: info

    livekit_egress_config:
        content: |
            redis:
                address: livekit-redis:6379
            api_key: ${LIVEKIT_API_KEY}
            api_secret: ${LIVEKIT_API_SECRET}
            ws_url: ws://livekit-server:7880
            insecure: true
            s3:
                access_key: ${RUSTFS_ACCESS_KEY}
                secret: ${RUSTFS_SECRET_KEY}
                region: ${LIVEKIT_RECORDING_REGION}
                endpoint: ${LIVEKIT_RECORDING_EGRESS_ENDPOINT}
                bucket: ${RUSTFS_BUCKET}
                force_path_style: true

volumes:
    user-postgres-data:
    meeting-postgres-data:
    chat-mongo-data:
    kafka-data:
    valkey-data:
    rustfs-data:
    livekit-redis-data:
