# Load-test overlay for the Smiski backend.
#
# This file deliberately contains NO copied service definitions. It composes
# services/docker/compose.yaml by reference and patches only what the
# measurement harness adds, so the test stack tracks the development stack
# automatically instead of drifting from a 510-line duplicate.
# services/docker/ is read-only for this change.
#
# Path resolution differs by file, and the difference is load-bearing:
#   - relative paths written HERE resolve against services/test/
#   - relative paths inside the INCLUDED file resolve against services/docker/
# So the inherited envoy, loki, alloy, grafana and prometheus mounts keep
# reading services/docker/, which is why the duplicated copies of those assets
# under services/test/ could be deleted without breaking the inherited stack.
#
# `name: smiski-test` prefixes every volume, network and config separately from
# the development stack (smiski-test_valkey-data vs docker_valkey-data), so the
# two never share data.
#
# BOTH .env files are loaded: services/docker/.env AND services/test/.env. On a
# key defined in both, services/test/.env wins; a key defined only in the
# development .env still resolves here. Measured, not assumed. See .env.example.
#
# Java service images are NOT built here — build them exactly as the development
# stack requires before starting this one.
#
# HOST PORTS ARE INHERITED UNCHANGED and are hardcoded in the included file
# (30000, 9901, 8281-8284, 9094, 7880-7882, and the observability ports). The
# two stacks therefore cannot be started simultaneously as written; run one at a
# time, or add `ports: !override` entries here.
#
# Validate with the profile enabled, or half this file goes unchecked:
#   COMPOSE_PROFILES=observability docker compose -f services/test/compose.yaml config
# A profile-gated service is not validated while its profile is inactive.
# Measured: pointing livekit-redis-exporter's depends_on at a nonexistent
# service still exits 0 for a plain `config`, and only fails once the
# observability profile is selected.
#
# TWO NETWORKS ARE PINNED. The media network 10.77.0.0/24 holds livekit-server
# (.10), harness (.11), coturn (.12) and one leg of nat-gw (.13) at static
# addresses; the client network 10.88.0.0/24 holds the browser (.10) and the
# other leg of nat-gw (.2). This is load bearing for TC-01: the browser can
# reach the media server ONLY through nat-gw, which source-NATs it, so ICE forms
# a real server-reflexive candidate rather than the forced relay the old design
# used. See nat-gw, browser and networks: below, and AGENTS.md "Two legs".
#
# ONE EXTRA HOST PORT is published beyond the inherited set: BROWSER_VNC_PORT
# (default 3010) for the noVNC console of the TC-01 browser. It is chosen off
# the inherited range because the inherited Grafana already owns host 3000.

name: smiski-test

include:
    - ../docker/compose.yaml

services:
    # Verifies Forge Invocation Tokens against a LOCAL key set instead of
    # Atlassian's remote JWKS, so a scripted caller can authenticate at all.
    #
    # Two mounts, and the distinction between them is load bearing:
    #   - envoy.yaml is replaced, because it is mounted at the SAME container
    #     path the included file uses. Compose merges `volumes:` by TARGET, so
    #     this entry displaces the development stack's without !override, while
    #     the inherited lua/ mount survives untouched — the overlay keeps no
    #     copy of extract_claims.lua and reads services/docker/envoy/lua
    #     directly.
    #   - keys/ is added, because nothing mounts that target. local_jwks reads
    #     a filesystem path, so the key material must exist inside the
    #     container; a host path alone would fail with `Invalid path`.
    #
    # Read-only: Envoy only ever reads the public key set. The private key sits
    # in the same gitignored directory and is deliberately never referenced by
    # Envoy — only `smiski test token` reads it, on the host.
    #
    # Run `smiski test keygen` BEFORE starting or validating this stack. Envoy
    # reads the JWKS at startup and at `--mode validate` time, and a missing
    # file is a hard failure rather than a degraded mode.
    envoy:
        volumes:
            - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
            - ./keys:/etc/envoy/keys:ro

    # Redirects the gateway's Jira permission lookups into the stack.
    #
    # JIRA_API_BASE is already an environment variable in the included file
    # (defaulting to https://api.atlassian.com), so this needs no change to
    # services/docker/ and no change to the Go source. On a cache miss the
    # gateway would otherwise call Atlassian with a 2 second timeout, which by
    # itself exceeds TC-04's 500 ms threshold.
    #
    # The value is HARDCODED rather than written as
    # ${JIRA_API_BASE:-http://mock-jira:8080}. Measured: services/docker/.env
    # already sets JIRA_API_BASE=https://api.atlassian.com, and BOTH .env files
    # are loaded, so the `:-` default is dead — the interpolated form resolved
    # to Atlassian and the gateway logged
    # `JiraAPIBase=https://api.atlassian.com` while the mock sat idle. A `:-`
    # default only fills an UNSET variable, and this one is never unset.
    # Redirecting the mock therefore means editing this line, not the .env.
    #
    # The failure was silent in the worst way: permission lookups still
    # "worked", falling back to an empty permission set after a 2 second
    # timeout, so the only symptom was latency in exactly the number TC-04
    # measures.
    #
    # depends_on keeps the gateway from starting against a mock that is not yet
    # listening, which would otherwise show up as a burst of failed permission
    # lookups at the start of a run rather than as a startup error.
    gateway:
        environment:
            JIRA_API_BASE: http://mock-jira:8080
        depends_on:
            mock-jira:
                condition: service_healthy

    # Fixed-response stand-in for the Jira Cloud bulk permission check.
    #
    # Runs the stdlib HTTP server on a pinned python image with the source bind
    # mounted, so there is no image to build and no dependency to install — the
    # harness stays runnable on a host with only a container runtime.
    #
    # It grants every permission it is asked for, ECHOING the identifiers from
    # the request. That is required, not incidental: the gateway builds
    # permission ARIs from the caller's own app and environment claims and
    # discards any grant that does not match, so fixed ARIs would be silently
    # dropped for any other token and present as an empty permission header
    # rather than an error. See mock-jira/server.py.
    #
    # No host port: only the gateway reads it, over the stack network.
    mock-jira:
        image: python:3.13-alpine
        command: ['python', '/app/server.py']
        working_dir: /app
        volumes:
            - ./mock-jira:/app:ro
        healthcheck:
            test:
                [
                    'CMD',
                    'python',
                    '-c',
                    'import urllib.request;
                    urllib.request.urlopen("http://127.0.0.1:8080/healthz").read()',
                ]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s

    # TURN relay AND STUN server, serving both legs of TC-01.
    #
    # Standalone rather than LiveKit's embedded `turn:` block: that needs a
    # CA-signed certificate matching its `domain`, unavailable locally, and
    # would give no separate container for the per-container resource
    # measurement the assignment asks for.
    #
    # UDP IS ENABLED, which is the change that makes real NAT traversal
    # measurable rather than forced. TC-01 now has two legs and Coturn serves a
    # different role in each:
    #   - Leg 1 (traversal): the client reaches Coturn over UDP/3478 as a STUN
    #     server, learns its post-NAT address and connects DIRECTLY to LiveKit —
    #     no relay. A `--no-udp` server could not answer the STUN binding and
    #     this leg could never produce a server-reflexive candidate.
    #   - Leg 2 (fallback): the browser namespace drops outbound UDP, so STUN/UDP
    #     and media/UDP both fail and ICE falls back to TURN over TCP/3478 on its
    #     own. Relay is chosen by ICE, not forced by iceTransportPolicy.
    # Still --no-tls/--no-dtls: LiveKit rejects self-signed certificates and a
    # locally trusted CA adds setup cost without changing what TC-01 proves.
    #
    # THE STATIC IP is load bearing. The browser is a container behind nat-gw on
    # a separate network and cannot resolve the `coturn` service name, so LiveKit
    # advertises Coturn to clients by the address below (rtc.turn_servers.host)
    # and the harness offers the same address as its STUN server. Pinned in the
    # lower half of the subnet, outside the dynamic ip_range — see networks.
    #
    # THE SECRET MUST MATCH what LiveKit advertises in rtc.turn_servers below.
    # Both read TURN_SHARED_SECRET with the same default for exactly that
    # reason. A mismatch does not fail at startup — it surfaces at join time as
    # a TURN allocation failure, which reads like a relay outage rather than a
    # configuration error.
    #
    # --no-cli disables the telnet admin interface, which otherwise listens on
    # 5766 with a well-known default password.
    #
    # No healthcheck: the image ships a shell but no curl, wget or nc, so there
    # is nothing to probe with. Readiness is observed from the prometheus
    # listener or from a client allocation instead.
    coturn:
        image: coturn/coturn:4.7
        command:
            - '-n'
            - '--realm=${TURN_REALM:-smiski.test}'
            - '--listening-port=${TURN_PORT:-3478}'
            - '--use-auth-secret'
            - '--static-auth-secret=${TURN_SHARED_SECRET:-change-me-turn-shared-secret}'
            - '--no-tls'
            - '--no-dtls'
            - '--no-cli'
            - '--prometheus'
            - '--log-file=stdout'
        ports:
            - '${TURN_PORT:-3478}:${TURN_PORT:-3478}/tcp'
            - '${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp'
        networks:
            default:
                ipv4_address: 10.77.0.12

    # Serves the browser QoS harness page for TC-01 and TC-02.
    #
    # A SEPARATE static page, not the Forge app. app/static/smiski-ui builds its
    # Room with no way to inject rtcConfig, and the relay-only toggle IS an
    # rtcConfig override, so measuring here is what keeps the production
    # application source untouched — which the specification requires.
    #
    # Plain nginx over a bind mount: the page is hand-written HTML plus a
    # vendored UMD build of livekit-client, so there is no build step, no
    # bundler, and no node_modules to install. Verified byte-identical to the
    # livekit-client 2.20.1 bundle app/ already depends on, so the harness
    # measures the same client the application uses.
    #
    # The mount is written HERE rather than inherited, which matters: relative
    # paths inside the INCLUDED file resolve against services/docker/, so a path
    # written there would silently read the wrong directory. This file resolves
    # against services/test/, so ./harness is correct.
    #
    # HARNESS_PORT is safe to interpolate with a `:-` default: unlike
    # JIRA_API_BASE it is absent from services/docker/.env, so the default
    # actually applies. Checked, not assumed.
    #
    # The page needs a HOST port because a browser loads it, and the browser
    # also needs to reach livekit-server directly on 7880 — WebRTC signalling is
    # a WebSocket the page opens itself, not something Envoy proxies.
    #
    # THE STATIC IP serves the containerised NAT client. The `browser` service
    # sits behind nat-gw on client-net and cannot resolve the `harness` service
    # name, so it opens the page by this address (http://10.77.0.11) routed
    # through the gateway. The host port stays published for TC-02/TC-03, which
    # still drive the page from a browser on the host.
    harness:
        image: nginx:1.29-alpine
        ports:
            - '${HARNESS_PORT:-8090}:80'
        volumes:
            - ./harness:/usr/share/nginx/html:ro
        networks:
            default:
                ipv4_address: 10.77.0.11
        depends_on:
            livekit-server:
                condition: service_healthy

    # Pins the media server to a known address and drops the inherited
    # --node-ip argument, so relay traversal works at all.
    #
    # THE DEFECT THIS FIXES. services/docker/compose.yaml starts LiveKit with
    # `--node-ip ${SMISKI_HOST_IP}`, so it advertises the host LAN address in
    # its ICE candidates while its real egress toward coturn is its container
    # address. Coturn installs the peer permission for the address LiveKit
    # ADVERTISED, so the connectivity check — arriving from the container
    # address — comes from an unpermitted source and is discarded. Measured
    # before this override: `requestsSent: 8, responsesReceived: 0,
    # state: failed`, with no error logged by either side. The only symptom is
    # a candidate pair that never completes.
    #
    # command: !override is REQUIRED, not cosmetic. Measured on
    # livekit-server v1.9.12: the CLI flag beats the configuration file, so with
    # both present `--node-ip 192.168.0.104` wins over an `rtc.node_ip` of
    # 10.99.99.99 and the configured value is ignored entirely. Only with the
    # flag removed does configuration take effect. The list is replaced rather
    # than merged because Compose appends to `command:` otherwise, which would
    # leave the flag in place.
    #
    # The inherited `SMISKI_HOST_IP` environment entry is deliberately left
    # alone: it is still what the included file's `:?` guard checks, and LiveKit
    # ignores it as an environment variable.
    #
    # The address itself is set in the livekit_server_config entry below, as
    # rtc.node_ip, next to the rest of the media configuration — not restated as
    # a command-line argument that would then have to track upstream changes.
    #
    # CONSEQUENCE WORTH KNOWING, AND IT DIFFERS BY CLIENT. The pinned address is
    # reachable from inside the stack but NOT from the host:
    #   - The containerised `browser` (TC-01) reaches 10.77.0.10 THROUGH nat-gw,
    #     so it can form a direct (server-reflexive) pair over UDP in Leg 1 and
    #     is pushed to a TURN/TCP relay only when Leg 2 drops its UDP. Both
    #     outcomes are chosen by ICE, which is the whole point of the two legs.
    #   - A browser on the HOST still cannot route to 10.77.0.10, so any
    #     host-driven connection (TC-02/TC-03) is relayed regardless of toggles.
    #     A host run is therefore never evidence of direct connectivity — read
    #     local_candidate_type in the export, never assume from the setup.
    livekit-server:
        command: !override
            - '--config'
            - '/etc/livekit/livekit.yaml'
        networks:
            default:
                ipv4_address: 10.77.0.10

    # Points Prometheus at THIS directory's scrape configuration.
    #
    # Required, and its absence is silent. Relative paths inside the included
    # file resolve against services/docker/, so the inherited mount reads
    # services/docker/observability/prometheus.yml and the overlay written here
    # is simply never used. Measured before this override existed: the stack
    # started cleanly, `docker compose config` exited zero, `promtool check
    # config` exited zero against the overlay file, and Prometheus served the
    # development stack's six jobs with livekit, livekit-redis and coturn
    # absent from /targets entirely — no error anywhere, just missing series.
    #
    # Volumes merge by TARGET, so naming the same container path replaces the
    # inherited entry without !override, and the prometheus-data volume is
    # inherited untouched.
    prometheus:
        volumes:
            - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    # The development stack instruments only `valkey`, the application cache,
    # and states that livekit-redis is "not instrumented". TC-05 sets a memory
    # threshold on "the Redis container" while the stack runs two, so this adds
    # the missing exporter and the two appear as separate scrape targets.
    #
    # Mirrors the shape of `valkey-exporter`, minus REDIS_PASSWORD: the
    # livekit-redis service runs redis:8-alpine with no password configured, so
    # forwarding an empty credential would only add noise.
    livekit-redis-exporter:
        image: oliver006/redis_exporter:v1.88.0-alpine
        profiles: [observability]
        environment:
            REDIS_ADDR: redis://livekit-redis:6379
        depends_on:
            livekit-redis:
                condition: service_healthy

    # The NAT gateway that makes TC-01 measure real traversal instead of forcing
    # a relay. It is the ONLY path between the client network and the media
    # network, and it rewrites the browser's source address on the way out —
    # which is exactly what a NAT does.
    #
    # WHY A SEPARATE CONTAINER. `browser` sits alone on `clients` (10.88.0.0/24)
    # and LiveKit/Coturn/harness sit on the media network (10.77.0.0/24). Docker
    # isolates the two networks, so the browser has no route to 10.77.0.0/24
    # except through this gateway, which is attached to both. Every packet the
    # browser sends toward the media server is therefore source-NAT'd here, and
    # the address LiveKit sees — and reflects back as the client's
    # server-reflexive candidate — is this gateway's media address, never the
    # browser's own. That reflexive candidate is the evidence Leg 1 records.
    #
    # THE NAT TYPE IS PORT-RESTRICTED CONE, which is what plain MASQUERADE plus
    # conntrack produces: endpoint-independent mapping, address-and-port
    # dependent filtering. Only one NAT type is emulated deliberately — in a
    # client-to-reachable-SFU topology, cone and symmetric NAT both traverse
    # directly via the reflexive candidate, so a second type would not produce a
    # second outcome. See AGENTS.md "Two legs of TC-01".
    #
    # RULES ARE SOURCE-BASED, NOT INTERFACE-BASED, on purpose. Docker does not
    # guarantee which of eth0/eth1 maps to which network, so matching on the
    # 10.88.0.0/24 source subnet is stable where `-o eth1` would silently break
    # if the ordering changed. FORWARD defaults to ACCEPT in a fresh namespace;
    # the explicit rules state intent and survive a stricter default.
    #
    # Leg 2 (the UDP block) is NOT set here. It is applied on demand to this
    # container's FORWARD chain by `smiski test impair blocked-udp --service
    # nat-gw`, so the gateway boots in the pass-through state Leg 1 needs and the
    # firewall is added only for the fallback measurement. `sleep infinity`
    # keeps the namespace alive for that sidecar to join.
    nat-gw:
        image: nicolaka/netshoot:v0.13
        cap_add:
            - NET_ADMIN
            - NET_RAW
        sysctls:
            net.ipv4.ip_forward: 1
        networks:
            clients:
                ipv4_address: 10.88.0.2
            default:
                ipv4_address: 10.77.0.13
        command:
            - /bin/bash
            - -c
            - |
                set -e
                iptables -t nat -A POSTROUTING -s 10.88.0.0/24 ! -d 10.88.0.0/24 -j MASQUERADE
                iptables -A FORWARD -s 10.88.0.0/24 -j ACCEPT
                iptables -A FORWARD -d 10.88.0.0/24 -m state --state RELATED,ESTABLISHED -j ACCEPT
                echo "nat-gw ready: port-restricted cone NAT for 10.88.0.0/24 -> 10.77.0.0/24"
                exec sleep infinity
        depends_on:
            livekit-server:
                condition: service_healthy

    # A real desktop Chromium behind the NAT, driven by hand over noVNC. This is
    # the TC-01 client: it forms its own peer connection to LiveKit and its
    # RTCStatsReport is the client-side evidence for both legs.
    #
    # WHY CONTAINERISED, replacing the host-browser flow. A browser on the host
    # shares the host's network and sits in front of no NAT, so it can only
    # produce host candidates or the forced relay the old TC-01 used. Putting the
    # browser on `clients`, reachable to the media server only through nat-gw,
    # is what places a genuine NAT in the media path — the entire point of this
    # change. It runs a full Chromium (not headless) because the operator drives
    # it by hand, per the chosen manual workflow.
    #
    # THE ROUTE INJECTION is load bearing and deliberately narrow. custom-init
    # adds a route to 10.77.0.0/24 via nat-gw and leaves the default route on the
    # Docker bridge. Redirecting the DEFAULT route would send noVNC reply traffic
    # to nat-gw too and break the operator's own session; scoping the route to
    # the media subnet sends only media traffic through the NAT while host access
    # to the noVNC port keeps working. NET_ADMIN is required to add the route.
    #
    # CHROME_CLI opens the harness page by IP (10.77.0.11) because this browser
    # cannot resolve the `harness` service name from the client network.
    #
    # Downloads are mapped into results/ so an exported CSV lands beside every
    # other artifact. The noVNC port is published on 3010, not 3000: the
    # inherited Grafana already publishes host 3000.
    #
    # BROWSER_IMAGE defaults to :latest for a first run; pin it to a specific
    # Chromium version tag for reproducible measurement — see .env.example.
    browser:
        image: ${BROWSER_IMAGE:-lscr.io/linuxserver/chromium:latest}
        security_opt:
            - seccomp:unconfined
        shm_size: '1gb'
        cap_add:
            - NET_ADMIN
        environment:
            PUID: '1000'
            PGID: '1000'
            TZ: ${TZ:-UTC}
            CHROME_CLI: http://10.77.0.11/
        ports:
            - '${BROWSER_VNC_PORT:-3010}:3000'
        volumes:
            - ./browser/custom-init.sh:/custom-cont-init.d/10-media-route.sh:ro
            - ./results:/config/Downloads
        networks:
            clients:
                ipv4_address: 10.88.0.10
        depends_on:
            nat-gw:
                condition: service_started
            harness:
                condition: service_started
            livekit-server:
                condition: service_healthy

networks:
    # Pinned so livekit-server can be given a static address, which is what
    # makes relay traversal work — see the livekit-server override above.
    #
    # The development stack declares no network at all and lets Compose create
    # the implicit `default` bridge with a daemon-assigned subnet. An including
    # file may declare ipam for that same implicit network and assign
    # ipv4_address to an inherited service; measured, not assumed.
    #
    # 10.77.0.0/24 is chosen to sit outside the 172.17-172.31 range Docker
    # allocates from by default, so it does not collide with another stack on a
    # developer machine. A collision here surfaces at startup as an address
    # conflict — a loud failure — rather than as the silent misrouting this
    # whole override exists to fix.
    #
    # ip_range confines DYNAMIC allocation to the upper half, and it is required
    # rather than tidy. Docker assigns dynamic addresses upward from the start of
    # the subnet, so without it a static .10 races the ~20 other containers in
    # this stack for the same address. Measured: notification-postgres took
    # 10.77.0.10 first and livekit-server then failed to start with
    # `failed to set up container networking: Address already in use`. Loud, but
    # dependent on startup order, so the static address is kept out of the
    # dynamic pool entirely instead of relying on being low enough or high
    # enough.
    default:
        ipam:
            config:
                - subnet: 10.77.0.0/24
                  ip_range: 10.77.0.128/25

    # The client side of the NAT, holding only `browser` and one leg of nat-gw.
    # Its whole purpose is to be a network the media server is NOT on, so the
    # only way across is the gateway. Pinned like the media network so nat-gw
    # can hold a known .2 the browser routes through; the range keeps dynamic
    # allocation clear of the two static addresses. 10.88.0.0/24 sits outside
    # Docker's default 172.17-172.31 pool for the same collision reason the
    # media network does.
    clients:
        ipam:
            config:
                - subnet: 10.88.0.0/24
                  ip_range: 10.88.0.128/25

configs:
    # A top-level config entry is replaced wholly by the including file, not
    # merged key by key, so this restates the development stack's content and
    # adds the two blocks the harness needs. Keep it in sync when the
    # development stack changes its LiveKit configuration.
    #
    # Added here:
    #   1. a Prometheus listener, so LiveKit publishes participant, track,
    #      packet-loss, jitter and round-trip-time series that TC-02/TC-03 read
    #   2. rtc.turn_servers, advertising the external Coturn container to
    #      clients over TCP
    #
    # `prometheus.port` is the current spelling. The flat `prometheus_port` key
    # named in the design still works on livekit-server v1.9.12 but logs
    # "prometheus_port is deprecated, please switch prometheus.port instead" on
    # every start; both serve the same /metrics on the same port.
    #
    # turn_servers is what advertises an EXTERNAL TURN server to clients. It is
    # not the `turn:` block, which configures LiveKit's own embedded TURN and
    # would need a CA-signed certificate this stack cannot produce locally.
    # protocol: tcp because TC-01 blocks all UDP — TURN over UDP/3478 would be
    # dropped along with the media path it is meant to rescue.
    # `secret` pairs with Coturn's `use-auth-secret`: LiveKit derives the
    # time-limited credential itself, so no static username is stored. The
    # server rejects unknown keys outright, so this shape is schema-checked.
    # node_ip pairs with the livekit-server override above and with the pinned
    # subnet: the address advertised in ICE candidates must be the one LiveKit
    # actually sends from, or coturn's peer permission is installed for an
    # address no packet ever arrives from. It is written literally because the
    # network declaration above pins it literally; the two are a pair and must
    # be changed together.
    livekit_server_config:
        content: |
            port: 7880
            prometheus:
                port: ${LIVEKIT_PROMETHEUS_PORT:-6789}
            bind_addresses:
                - 0.0.0.0
            rtc:
                tcp_port: 7881
                use_external_ip: false
                udp_port: 7882
                node_ip: 10.77.0.10
                turn_servers:
                    - host: ${TURN_HOST:-coturn}
                      port: ${TURN_PORT:-3478}
                      protocol: tcp
                      secret: ${TURN_SHARED_SECRET:-change-me-turn-shared-secret}
                      ttl: ${TURN_CREDENTIAL_TTL:-86400}
            redis:
                address: livekit-redis:6379
            keys:
                ${LIVEKIT_API_KEY:-smiski-livekit-key}: ${LIVEKIT_API_SECRET:-change-me-livekit-secret-must-be-at-least-32-chars}
            webhook:
                api_key: ${LIVEKIT_API_KEY:-smiski-livekit-key}
                urls:
                    - ${LIVEKIT_WEBHOOK_URL:-http://meet:8080/api/1/webhooks/livekit}
            logging:
                level: info
