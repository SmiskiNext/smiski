openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: API Gateway
tags:
- name: meeting-events-controller
  description: Real-time meeting join notifications over Server-Sent Events
paths:
  /api/{version}/webhooks/resend/inbound:
    post:
      tags:
      - resend-inbound-webhook-controller
      operationId: handleInboundEmail
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: OK
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    parameters:
    - name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: 1
  /api/{version}/meetings/{id}/join-requests/{requestId}/events:
    get:
      tags:
      - meeting-events-controller
      summary: Subscribe to a join request's decision
      description: "Opens a text/event-stream connection scoped by request id that\
        \ delivers the host's accept/decline outcome as a join_request_approved (token,\
        \ roomName) or join_request_denied (reason) event, replays a decision already\
        \ recorded before subscribe, and sends periodic heartbeat comments until the\
        \ configured timeout."
      operationId: subscribeRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    parameters:
    - name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: 1
  /api/{version}/meetings/{id}/events:
    get:
      tags:
      - meeting-events-controller
      summary: Subscribe to a meeting's join events
      description: "Opens a text/event-stream connection that delivers join_request_created\
        \ events for the meeting, replays currently pending requests on subscribe,\
        \ and sends periodic heartbeat comments until the configured timeout."
      operationId: subscribe
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    parameters:
    - name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: 1
components:
  schemas:
    SseEmitter:
      type: object
      properties:
        timeout:
          type: integer
          format: int64
    ProblemDetail:
      description: RFC 9457 Problem Details response body
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
          example: about:blank
        title:
          type: string
          description: Short human-readable summary of the problem
          example: Bad Request
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          example: The request body failed validation
        code:
          type: string
          description: Machine-readable error code
          example: VALIDATION_ERROR
        traceId:
          type: string
          description: Distributed trace identifier for correlation
          example: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        errors:
          type: array
          description: Field-level validation errors (present when code is VALIDATION_ERROR)
          items:
            $ref: "#/components/schemas/Violation"
    Violation:
      description: Field-level validation error
      properties:
        field:
          type: string
          description: Request field that failed validation
          example: app.id
        code:
          type: string
          description: Machine-readable violation category
          enum:
          - REQUIRED
          - INVALID_FORMAT
          - TOO_SHORT
          - TOO_LONG
          - INVALID_VALUE
          example: REQUIRED
        message:
          type: string
          description: Server-localized human-readable message
          example: must not be blank
