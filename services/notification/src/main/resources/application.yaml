spring:
    application:
        name: notification

    mvc:
        apiversion:
            use:
                path-segment: 1
            default: 1
            supported: 1

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD:}

    threads:
        virtual:
            enabled: true

logging:
    aspect:
        include-args: false

app:
    sse:
        host-stream-timeout-ms: ${SSE_HOST_STREAM_TIMEOUT_MS:300000}
        heartbeat-interval-seconds: ${SSE_HEARTBEAT_INTERVAL_SECONDS:15}
    notification:
        kafka:
            invitation-consumer-group: ${INVITATION_CONSUMER_GROUP:notification-meeting-invitations}
            invite-invalidated-consumer-group: ${INVITE_INVALIDATED_CONSUMER_GROUP:notification-meeting-invite-invalidated}
            invitee-responded-consumer-group: ${INVITEE_RESPONDED_CONSUMER_GROUP:notification-invitee-responded}
