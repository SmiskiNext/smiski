spring:
    application:
        name: notification

    mvc:
        apiversion:
            use:
                path-segment: 1
            default: 1
            supported: 1

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification}
        username: ${POSTGRES_USER:smiski_user}
        password: ${POSTGRES_PASSWORD:smiski_secret}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
        enabled: true
        locations: classpath:db/migration

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD:}

    threads:
        virtual:
            enabled: true

app:
    logging:
        aspect:
            include-args: false
    sse:
        host-stream-timeout-ms: ${SSE_HOST_STREAM_TIMEOUT_MS:300000}
        heartbeat-interval-seconds: ${SSE_HEARTBEAT_INTERVAL_SECONDS:15}
    notification:
        kafka:
            invitation-consumer-group: ${INVITATION_CONSUMER_GROUP:notification-meeting-invitations}
            invitee-responded-consumer-group: ${INVITEE_RESPONDED_CONSUMER_GROUP:notification-invitee-responded}
            meeting-info-updated-consumer-group: ${MEETING_INFO_UPDATED_CONSUMER_GROUP:notification-meeting-info-updated}
            tenant-installed-consumer-group: ${TENANT_INSTALLED_CONSUMER_GROUP:notification-tenant-installed}
            tenant-uninstalled-consumer-group: ${TENANT_UNINSTALLED_CONSUMER_GROUP:notification-tenant-uninstalled}
            email-retry-attempts: ${EMAIL_RETRY_ATTEMPTS:3}
            email-retry-backoff-ms: ${EMAIL_RETRY_BACKOFF_MS:1000}
            email-dead-letter-suffix: ${EMAIL_DEAD_LETTER_SUFFIX:.dlt}
        email:
            api-key: ${RESEND_API_KEY:}
            sender: ${RESEND_SENDER:calendar@smiskinext.io}
            default-locale: ${EMAIL_DEFAULT_LOCALE:en}
        webhook:
            signing-secret: ${RESEND_WEBHOOK_SECRET:}
