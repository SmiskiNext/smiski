spring:
    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    jpa:
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
    flyway:
        enabled: true
        locations: classpath:db/migration

app:
    notification:
        kafka:
            invitation-consumer-group: test-notification-meeting-invitations
            invite-invalidated-consumer-group: test-notification-meeting-invite-invalidated
            invitee-responded-consumer-group: test-notification-invitee-responded
            tenant-installed-consumer-group: test-notification-tenant-installed
            tenant-uninstalled-consumer-group: test-notification-tenant-uninstalled
            email-retry-attempts: 2
            email-retry-backoff-ms: 200
            email-dead-letter-suffix: .dlt
        email:
            api-key: test-resend-key
            sender: calendar@test.local
        webhook:
            signing-secret: whsec_dGVzdC1zZWNyZXQtZm9yLWludGVncmF0aW9uLXRlc3Q=
