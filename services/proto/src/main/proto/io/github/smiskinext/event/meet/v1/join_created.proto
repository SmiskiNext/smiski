syntax = "proto3";

package io.github.smiskinext.event.meet.v1;

option java_multiple_files = true;
option java_package = "io.github.smiskinext.event.meet.v1";

message JoinCreated {
  string meeting_id = 1;
  string join_request_id = 2;
  string tenant_id = 3;
  string account_id = 4;
  string display_name = 5;
  string device_id = 6;
  string occurred_at = 7;
  string avatar_url = 8;
}
