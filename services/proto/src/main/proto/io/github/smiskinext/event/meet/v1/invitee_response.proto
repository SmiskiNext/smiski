syntax = "proto3";

package io.github.smiskinext.event.meet.v1;

option java_multiple_files = true;
option java_package = "io.github.smiskinext.event.meet.v1";

message InviteeAccepted {
  string event_id = 1;
  string tenant_id = 2;
  string meeting_id = 3;
  string inviter_id = 4;
  string invitee_id = 5;
  string invitee_email = 6;
  string status = 7;
  string accepted_at = 8;
}

message InviteeDeclined {
  string event_id = 1;
  string tenant_id = 2;
  string meeting_id = 3;
  string inviter_id = 4;
  string invitee_id = 5;
  string invitee_email = 6;
  string status = 7;
  string declined_at = 8;
}
