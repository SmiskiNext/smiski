syntax = "proto3";

package io.github.smiskinext.event.meet.v1;

import "io/github/smiskinext/event/meet/v1/meeting_snapshot.proto";

option java_multiple_files = true;
option java_package = "io.github.smiskinext.event.meet.v1";

message MeetingStarted {
  MeetingSnapshot snapshot = 1;
  string livekit_room_name = 2;
  string started_at = 3;
}
