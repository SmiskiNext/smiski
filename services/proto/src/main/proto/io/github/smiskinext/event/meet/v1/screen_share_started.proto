syntax = "proto3";

package io.github.smiskinext.event.meet.v1;

option java_multiple_files = true;
option java_package = "io.github.smiskinext.event.meet.v1";

message ScreenShareStarted {
  string meeting_id = 1;
  string tenant_id = 2;
  string account_id = 3;
  string occurred_at = 4;
  string identity = 5;
}
