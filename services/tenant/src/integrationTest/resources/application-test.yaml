spring:
    jpa:
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
        enabled: true
        locations: classpath:db/migration

app:
    cursor:
        secret: test-cursor-secret-fixed-value-for-tests
    forge:
        app-id: ari:cloud:ecosystem::app/test
        jwks-uri: https://example.com/.well-known/jwks.json
        environment-type: DEVELOPMENT
        clock-skew-seconds: 10
