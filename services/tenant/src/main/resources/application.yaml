spring:
    application:
        name: tenant

    mvc:
        apiversion:
            use:
                path-segment: 1
            default: 1
            supported: 1

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tenant}
        username: ${POSTGRES_USER:smiski_user}
        password: ${POSTGRES_PASSWORD:smiski_secret}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
        enabled: true
        locations: classpath:db/migration

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            acks: all
            retries: 3
            properties:
                enable.idempotence: true
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: io.cloudevents.kafka.CloudEventSerializer

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD:}

    threads:
        virtual:
            enabled: true

management:
    endpoints:
        web:
            exposure:
                include: health,prometheus

app:
    logging:
        aspect:
            include-args: false
    cursor:
        secret: ${CURSOR_SECRET}
    outbox:
        transport: kafka
        relay:
            enabled: true
            fixed-delay: PT5S
            batch-size: 50
        cloudevent:
            source: tenant-service
    tenant:
        retention:
            purge-after: P30D

springdoc:
    api-docs:
        enabled: true
    swagger-ui:
        enabled: false
