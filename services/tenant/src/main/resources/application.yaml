spring:
    application:
        name: tenant

    mvc:
        apiversion:
            use:
                path-segment: 1
            default: 1
            supported: 1

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zms_tenants}
        username: zms_user
        password: zms_secret
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
        enabled: true
        locations: classpath:db/migration

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            acks: all
            retries: 3
            properties:
                enable.idempotence: true
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: io.cloudevents.kafka.CloudEventSerializer

    threads:
        virtual:
            enabled: true

app:
    forge:
        app-id: ${FORGE_APP_ID:ari:cloud:ecosystem::app/change-me}
        jwks-uri: ${FORGE_JWKS_URI:https://forge.cdn.prod.atlassian-dev.net/.well-known/jwks.json}
        environment-type: ${FORGE_ENVIRONMENT_TYPE:DEVELOPMENT}
        clock-skew-seconds: ${FORGE_CLOCK_SKEW_SECONDS:10}

logging:
    aspect:
        include-args: false

springdoc:
    api-docs:
        enabled: true
    swagger-ui:
        enabled: false
    servers:
        - url: ${GATEWAY_URL:http://localhost:8080}
          description: API Gateway
