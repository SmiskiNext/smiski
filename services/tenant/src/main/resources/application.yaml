spring:
    application:
        name: tenant

    mvc:
        apiversion:
            use:
                path-segment: 1
            default: 1
            supported: 1

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zms_tenants}
        username: zms_user
        password: zms_secret
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
        enabled: true
        locations: classpath:db/migration

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            acks: all
            retries: 3
            properties:
                enable.idempotence: true
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: io.cloudevents.kafka.CloudEventSerializer

    threads:
        virtual:
            enabled: true

logging:
    aspect:
        include-args: false

springdoc:
    api-docs:
        enabled: true
    swagger-ui:
        enabled: false
