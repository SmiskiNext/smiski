openapi: 3.1.0
info:
  title: Meet
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: API Gateway
tags:
- name: livekit-webhook-controller
  description: Receives LiveKit server webhooks
- name: meeting-controller
  description: "Meeting lifecycle: schedule, create instant, update, list, delete\
    \ meetings and manage invitees"
paths:
  /api/{version}/meetings/{id}:
    get:
      tags:
      - meeting-controller
      summary: Get a meeting with its people
      description: Returns a single meeting in the caller's tenant together with its
        active invitee list and its distinct joined-participant list. Any authenticated
        tenant member may read the meeting; access is not restricted to the host.
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Meeting detail with invitees and participants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMeetingResponse"
              examples:
                detail:
                  description: detail
                  value:
                    meeting:
                      id: 0195e0c2-8f3a-7c21-b9d4-2f1a6e7c8d90
                      hostId: account-123
                      shortCode: abc-defg-hij
                      type: SCHEDULED
                      status: SCHEDULED
                      title: Sprint planning
                      description: Plan the next sprint
                      issueLink:
                        issueId: "10001"
                        issueKey: PROJ-1
                        projectKey: PROJ
                      settings:
                        admissionPolicy: MANUAL_APPROVAL
                        maxParticipants: 50
                        allowScreenShare: true
                        chatEnabled: true
                        allowMicrophone: true
                        allowVideo: true
                      startTime: 2025-02-01T14:00:00Z
                      endTime: 2025-02-01T15:00:00Z
                      zoneId: Asia/Ho_Chi_Minh
                      organizerEmail: host@example.com
                      organizerDisplayName: Host User
                      calendarUid: meeting-0195e0c2@smiski.app
                      calendarSequence: 1
                      createdAt: 2025-01-15T10:30:00Z
                    invitees:
                    - accountId: account-456
                      email: alice@example.com
                      displayName: Alice Nguyen
                      status: ACCEPTED
                      invitedAt: 2025-01-15T10:35:00Z
                      respondedAt: 2025-01-15T11:00:00Z
                    participants:
                    - accountId: account-456
                      role: PARTICIPANT
                      joinedAt: 2025-02-01T14:01:00Z
                      leftAt: null
        "400":
          description: Missing account header
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                missingAccount:
                  description: missingAccount
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: X-Account-Id header is required
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "404":
          description: "Meeting not found, soft-deleted, or in another tenant"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                notFound:
                  description: notFound
                  value:
                    type: about:blank
                    title: Meeting not found
                    status: 404
                    detail: No meeting matches the given identifier.
                    code: MEETING_NOT_FOUND
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
      - meeting-controller
      summary: Update meeting information
      description: "Updates a meeting's information as its host: title, description,\
        \ issue link, zone ID, and time range. Mutable while scheduled or running;\
        \ zone ID and time range are mutable only while scheduled. To replace the\
        \ settings block, use PUT /meetings/{id}/settings instead."
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeetingRequest"
        required: true
      responses:
        "200":
          description: Meeting information updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateMeetingResponse"
              examples:
                updated:
                  description: updated
                  value:
                    meeting:
                      id: 0195e0c2-8f3a-7c21-b9d4-2f1a6e7c8d90
                      hostId: account-123
                      shortCode: abc-defg-hij
                      type: SCHEDULED
                      status: SCHEDULED
                      title: Sprint planning
                      description: Plan the next sprint
                      issueLink:
                        issueId: "10001"
                        issueKey: PROJ-1
                        projectKey: PROJ
                      startTime: 2025-02-01T14:00:00Z
                      endTime: 2025-02-01T15:00:00Z
                      zoneId: Asia/Ho_Chi_Minh
                      organizerEmail: host@example.com
                      organizerDisplayName: Host User
                      calendarUid: meeting-0195e0c2@smiski.app
                      calendarSequence: 1
                      createdAt: 2025-01-15T10:30:00Z
        "400":
          description: Validation error or missing account
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                validationError:
                  summary: Validation failure
                  description: validationError
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: The request body failed validation
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
                    errors:
                    - field: title
                      code: REQUIRED
                      message: must not be blank
                missingAccount:
                  summary: Missing X-Account-Id header
                  description: missingAccount
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: X-Account-Id header is required
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "403":
          description: Only the host may update the meeting
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                notOwner:
                  description: notOwner
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    detail: Only the host may update the meeting
                    code: NOT_OWNER
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "404":
          description: Meeting not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                notFound:
                  description: notFound
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    detail: Meeting not found
                    code: MEETING_NOT_FOUND
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
      - meeting-controller
      summary: Delete a meeting
      description: "Soft-deletes a meeting as its host. Running meetings must be ended\
        \ first, and already-deleted meetings are treated as not found."
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Meeting deleted; returns the deleted meeting snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMeetingResponse"
              examples:
                deleted:
                  description: deleted
                  value:
                    meeting:
                      id: 0195e0c2-8f3a-7c21-b9d4-2f1a6e7c8d90
                      hostId: account-123
                      shortCode: abc-defg-hij
                      type: SCHEDULED
                      status: DELETED
                      title: Sprint planning
                      description: Plan the next sprint
                      issueLink:
                        issueId: "10001"
                        issueKey: PROJ-1
                        projectKey: PROJ
                      settings:
                        admissionPolicy: MANUAL_APPROVAL
                        maxParticipants: 50
                        allowScreenShare: true
                        chatEnabled: true
                        allowMicrophone: true
                        allowVideo: true
                      startTime: 2025-02-01T14:00:00Z
                      endTime: 2025-02-01T15:00:00Z
                      zoneId: Asia/Ho_Chi_Minh
                      organizerEmail: host@example.com
                      organizerDisplayName: Host User
                      calendarUid: meeting-0195e0c2@smiski.app
                      calendarSequence: 0
                      createdAt: 2025-01-15T10:30:00Z
                      deletedAt: 2025-01-20T09:00:00Z
                      deletedBy: account-123
        "400":
          description: Missing account header
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                missingAccount:
                  description: missingAccount
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: X-Account-Id header is required
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "403":
          description: Only the host may delete the meeting
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                notAuthorized:
                  description: notAuthorized
                  value:
                    type: about:blank
                    title: Not authorized
                    status: 403
                    detail: You are not the host of this meeting.
                    code: NOT_AUTHORIZED
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "404":
          description: Meeting not found or already deleted
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                notFound:
                  description: notFound
                  value:
                    type: about:blank
                    title: Meeting not found
                    status: 404
                    detail: No meeting matches the given identifier.
                    code: MEETING_NOT_FOUND
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "409":
          description: The meeting is running and cannot be deleted
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                running:
                  description: running
                  value:
                    type: about:blank
                    title: Cannot delete a running meeting
                    status: 409
                    detail: The meeting is running and must be ended before deletion.
                    code: CANNOT_DELETE_RUNNING_MEETING
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    parameters:
    - name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: 1
  /api/{version}/meetings/{id}/settings:
    put:
      tags:
      - meeting-controller
      summary: Replace meeting settings
      description: "Replaces the entire meeting settings block as its host: admission\
        \ policy, participant limit, and media/chat permissions. Permitted while the\
        \ meeting is SCHEDULED or RUNNING. When the change affects media permissions,\
        \ every connected non-host participant's LiveKit publish permission is updated\
        \ in real time on a best-effort basis; the host is never affected."
      operationId: updateSettings
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeetingSettingsRequest"
        required: true
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateMeetingSettingsResponse"
              examples:
                updated:
                  description: updated
                  value:
                    meetingId: 0195e0c2-8f3a-7c21-b9d4-2f1a6e7c8d90
                    admissionPolicy: ALLOW_ALL
                    maxParticipants: 50
                    allowScreenShare: true
                    chatEnabled: true
                    allowMicrophone: true
                    allowVideo: true
        "400":
          description: Validation error or missing account
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                validationError:
                  summary: Validation failure
                  description: validationError
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: The request body failed validation
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
                    errors:
                    - field: maxParticipants
                      code: TOO_SHORT
                      message: must be between 2 and 100
                missingAccount:
                  summary: Missing X-Account-Id header
                  description: missingAccount
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: X-Account-Id header is required
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "403":
          description: Only the host may replace the settings
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                notAuthorized:
                  description: notAuthorized
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    detail: Only the host may change the meeting settings
                    code: NOT_AUTHORIZED
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "404":
          description: Meeting not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                notFound:
                  description: notFound
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    detail: Meeting not found
                    code: MEETING_NOT_FOUND
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    parameters:
    - name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: 1
  /api/{version}/webhooks/livekit:
    post:
      tags:
      - livekit-webhook-controller
      summary: Receive a LiveKit webhook
      description: Verifies the LiveKit signed-JWT payload against the raw body and
        enqueues the decoded event for asynchronous processing.
      operationId: receive
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/webhook+json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: Signature valid; event accepted
        "400":
          description: Body could not be decoded
        "401":
          description: Missing or invalid signature
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    parameters:
    - name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: 1
  /api/{version}/meetings:
    post:
      tags:
      - meeting-controller
      summary: List tenant meetings
      description: "Lists meetings in the caller's tenant with optional creator, status,\
        \ issue, project, and text filters, two sort modes, and opaque keyset pagination.\
        \ The request body is optional; an empty body lists with defaults."
      operationId: list
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListMeetingsRequest"
      responses:
        "200":
          description: Page of tenant meetings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingListPage"
              examples:
                page:
                  description: page
                  value:
                    data:
                    - id: 0195e0c2-8f3a-7c21-b9d4-2f1a6e7c8d90
                      hostId: account-123
                      shortCode: abc-defg-hij
                      title: Sprint planning
                      description: Plan the next sprint
                      issueId: issue-SMISKI-102
                      issueKey: SMISKI-102
                      projectKey: SMISKI
                      type: SCHEDULED
                      status: SCHEDULED
                      startTime: 2025-02-01T14:00:00Z
                      endTime: 2025-02-01T15:00:00Z
                      createdAt: 2025-01-15T10:30:00Z
                      settings:
                        admissionPolicy: MANUAL_APPROVAL
                        maxParticipants: 50
                        allowScreenShare: true
                        chatEnabled: true
                        allowMicrophone: true
                        allowVideo: true
                    meta:
                      size: 1
                      hasNext: true
                      nextPageToken: Uy5leUov...
        "400":
          description: "Missing account header, page-size validation, or invalid cursor"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                invalidCursor:
                  summary: Invalid or sort-mismatched page token
                  description: invalidCursor
                  value:
                    type: about:blank
                    title: Invalid page cursor
                    status: 400
                    detail: The page cursor is invalid; restart from the first page.
                    code: INVALID_CURSOR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
                missingAccount:
                  summary: Missing X-Account-Id header
                  description: missingAccount
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: X-Account-Id header is required
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    parameters:
    - name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: 1
  /api/{version}/meetings:schedule:
    post:
      tags:
      - meeting-controller
      summary: Create a scheduled meeting
      description: Creates a new SCHEDULED meeting with a future time range. The meeting
        stays in SCHEDULED status and no LiveKit token is issued.
      operationId: schedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleMeetingRequest"
        required: true
      responses:
        "201":
          description: Scheduled meeting created
          headers:
            Location:
              description: URI of the newly created meeting
              style: simple
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleMeetingResponse"
              examples:
                created:
                  description: created
                  value:
                    meeting:
                      id: 0195e0c2-8f3a-7c21-b9d4-2f1a6e7c8d90
                      hostId: account-123
                      shortCode: abc-defg-hij
                      type: SCHEDULED
                      status: SCHEDULED
                      title: Sprint planning
                      description: Plan the next sprint
                      issueLink:
                        issueId: "10001"
                        issueKey: PROJ-1
                        projectKey: PROJ
                      settings:
                        admissionPolicy: MANUAL_APPROVAL
                        maxParticipants: 50
                        allowScreenShare: true
                        chatEnabled: true
                        allowMicrophone: true
                        allowVideo: true
                      startTime: 2025-02-01T14:00:00Z
                      endTime: 2025-02-01T15:00:00Z
                      zoneId: Asia/Ho_Chi_Minh
                      organizerEmail: host@example.com
                      organizerDisplayName: Host User
                      calendarUid: meeting-0195e0c2@smiski.app
                      calendarSequence: 1
                      createdAt: 2025-01-15T10:30:00Z
        "400":
          description: "Validation error, missing account header, or start time in\
            \ past"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                validationError:
                  summary: Validation failure
                  description: validationError
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: The request body failed validation
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
                    errors:
                    - field: settings
                      code: REQUIRED
                      message: must not be null
                startTimeInPast:
                  summary: Start time is in the past
                  description: startTimeInPast
                  value:
                    type: about:blank
                    title: Start time is in the past
                    status: 400
                    detail: "The scheduled start time is in the past: 2025-01-10T08:00:00Z."
                    code: MEETING_START_IN_PAST
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
                missingAccount:
                  summary: Missing X-Account-Id header
                  description: missingAccount
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: X-Account-Id header is required
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    parameters:
    - name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: 1
  /api/{version}/meetings:instant:
    post:
      tags:
      - meeting-controller
      summary: Create an instant meeting
      description: "Creates a new INSTANT meeting, auto-starts it to RUNNING, registers\
        \ invitees with invite tokens, and returns a meeting snapshot plus a LiveKit\
        \ HOST access token."
      operationId: createInstant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstantMeetingRequest"
        required: true
      responses:
        "201":
          description: Instant meeting created
          headers:
            Location:
              description: URI of the newly created meeting
              style: simple
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInstantMeetingResponse"
              examples:
                created:
                  description: created
                  value:
                    meeting:
                      id: 0195e0c2-8f3a-7c21-b9d4-2f1a6e7c8d90
                      hostId: account-123
                      shortCode: abc-defg-hij
                      type: INSTANT
                      status: RUNNING
                      title: Daily standup
                      description: Quick sync on progress
                      issueLink:
                        issueId: "10001"
                        issueKey: PROJ-1
                        projectKey: PROJ
                      settings:
                        admissionPolicy: MANUAL_APPROVAL
                        maxParticipants: 50
                        allowScreenShare: true
                        chatEnabled: true
                        allowMicrophone: true
