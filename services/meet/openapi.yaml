  /api/{version}/meetings/{id}/join-requests:
    get:
      tags:
      - meeting-controller
      summary: List pending join requests
      description: Returns a paginated list of PENDING join requests for a meeting
        with MANUAL_APPROVAL admission policy. Only the meeting host may call this
        endpoint. Use offset and pageSize query parameters for pagination.
      operationId: listPendingJoinRequests
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Paginated list of pending join requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPendingJoinRequestsResponse"
              examples:
                list:
                  description: list
                  value:
                    results:
                    - requestId: 0195e0c2-8f3a-7c21-b9d4-2f1a6e7c8d90
                      accountId: account-456
                      displayName: Alice Nguyen
                      status: PENDING
                      requestedAt: 2025-02-01T14:00:00Z
                      expiresAt: 2025-02-01T14:05:00Z
                    meta:
                      total: 1
                      offset: 0
                      pageSize: 20
        "400":
          description: Missing account header or pageSize out of range
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                missingAccount:
                  summary: Missing X-Account-Id header
                  description: missingAccount
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: X-Account-Id header is required
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
                pageSizeOutOfRange:
                  summary: pageSize is 0 or greater than 100
                  description: pageSizeOutOfRange
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: pageSize must be between 1 and 100
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "403":
          description: Only the host may list pending join requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                notOwner:
                  description: notOwner
                  value:
                    type: about:blank
                    title: Not authorized
                    status: 403
                    detail: You do not own the requested user scope.
                    code: NOT_OWNER
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "404":
          description: Meeting not found for the current tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                notFound:
                  description: notFound
                  value:
                    type: about:blank
                    title: Meeting not found
                    status: 404
                    detail: No meeting matches the given identifier.
                    code: MEETING_NOT_FOUND
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
