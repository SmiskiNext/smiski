openapi: 3.1.0
info:
  title: Meet
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: API Gateway
paths:
  /api/{version}/meetings/{id}:
    put:
      tags:
      - meeting-controller
      summary: Update a meeting
      description: Updates a meeting as its host. Information and settings are mutable
        while scheduled or running; scheduled details are mutable only while scheduled.
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeetingRequest"
        required: true
      responses:
        "200":
          description: Meeting updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateMeetingResponse"
        "400":
          description: Validation error or missing account
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Only the host may update the meeting
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Meeting not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    parameters:
    - name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: 1
  /api/{version}/meetings/{id}/invitees:
    put:
      tags:
      - meeting-controller
      summary: Replace a meeting's invitee list
      description: "Replaces the full invitee list of a SCHEDULED meeting as its host.\
        \ Invitees are matched by accountId: new entries are created, existing entries\
        \ have their display name updated, and absent entries are removed."
      operationId: updateInvitees
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeetingInviteesRequest"
        required: true
      responses:
        "200":
          description: Invitees synchronized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateMeetingInviteesResponse"
        "400":
          description: Validation error or missing account
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Only the host may modify invitees
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Meeting not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    parameters:
    - name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: 1
  /api/{version}/meetings:schedule:
    post:
      tags:
      - meeting-controller
      summary: Create a scheduled meeting
      description: Creates a new SCHEDULED meeting with a future time range. The meeting
        stays in SCHEDULED status and no LiveKit token is issued.
      operationId: schedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleMeetingRequest"
        required: true
      responses:
        "201":
          description: Scheduled meeting created
          headers:
            Location:
              description: URI of the newly created meeting
              style: simple
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleMeetingResponse"
              examples:
                created:
                  description: created
                  value:
                    meeting:
                      id: 0195e0c2-8f3a-7c21-b9d4-2f1a6e7c8d90
                      hostId: account-123
                      shortCode: abc-defg-hij
                      type: SCHEDULED
                      status: SCHEDULED
                      title: Sprint planning
                      description: Plan the next sprint
                      issueLink:
                        issueId: "10001"
                        issueKey: PROJ-1
                        projectKey: PROJ
                      settings:
                        admissionPolicy: OPEN
                        maxParticipants: 50
                        allowScreenShare: true
                        chatEnabled: true
                        allowMicrophone: true
                        allowVideo: true
                      startTime: 2025-02-01T14:00:00Z
                      endTime: 2025-02-01T15:00:00Z
                      createdAt: 2025-01-15T10:30:00Z
        "400":
          description: "Validation error, missing account header, or start time in\
            \ past"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                validationError:
                  summary: Validation failure
                  description: validationError
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: The request body failed validation
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
                    errors:
                    - field: settings
                      code: REQUIRED
                      message: must not be null
                startTimeInPast:
                  summary: Start time is in the past
                  description: startTimeInPast
                  value:
                    type: about:blank
                    title: Start time is in the past
                    status: 400
                    detail: "The scheduled start time is in the past: {0}."
                    code: MEETING_START_IN_PAST
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    parameters:
    - name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: 1
  /api/{version}/meetings:instant:
    post:
      tags:
      - meeting-controller
      summary: Create an instant meeting
      description: "Creates a new INSTANT meeting, auto-starts it to RUNNING, registers\
        \ invitees with invite tokens, and returns a meeting snapshot plus a LiveKit\
        \ HOST access token."
      operationId: createInstant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstantMeetingRequest"
        required: true
      responses:
        "201":
          description: Instant meeting created
          headers:
            Location:
              description: URI of the newly created meeting
              style: simple
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInstantMeetingResponse"
              examples:
                created:
                  description: created
                  value:
                    meeting:
                      id: 0195e0c2-8f3a-7c21-b9d4-2f1a6e7c8d90
                      hostId: account-123
                      shortCode: abc-defg-hij
                      type: INSTANT
                      status: RUNNING
                      title: Daily standup
                      description: Quick sync on progress
                      issueLink:
                        issueId: "10001"
                        issueKey: PROJ-1
                        projectKey: PROJ
                      settings:
                        admissionPolicy: OPEN
                        maxParticipants: 50
                        allowScreenShare: true
                        chatEnabled: true
                        allowMicrophone: true
                        allowVideo: true
                      createdAt: 2025-01-15T10:30:00Z
                    livekit:
                      token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.token
                      roomName: meeting-0195e0c2
        "400":
          description: Validation error or missing account header
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                validationError:
                  summary: Validation failure
                  description: validationError
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: The request body failed validation
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
                    errors:
                    - field: settings
                      code: REQUIRED
                      message: must not be null
                missingAccount:
                  summary: Missing X-Account-Id header
                  description: missingAccount
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: X-Account-Id header is required
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    parameters:
    - name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: 1
components:
  schemas:
    IssueLink:
      type: object
      properties:
        issueId:
          type: string
        issueKey:
          type: string
        projectKey:
          type: string
    Settings:
      type: object
      properties:
        admissionPolicy:
          type: string
        maxParticipants:
          type: integer
          format: int32
        allowScreenShare:
          type: boolean
        chatEnabled:
          type: boolean
        allowMicrophone:
          type: boolean
        allowVideo:
          type: boolean
    TimeRange:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
      required:
      - endTime
      - startTime
    UpdateMeetingRequest:
      type: object
      description: Full meeting update request
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 0
        description:
          type: string
          minLength: 1
        issueLink:
          $ref: "#/components/schemas/IssueLink"
        settings:
          $ref: "#/components/schemas/Settings"
        zoneId:
          type: string
          minLength: 1
        timeRange:
          $ref: "#/components/schemas/TimeRange"
        timeRangeValid:
          type: boolean
      required:
      - description
      - issueLink
      - settings
      - title
      - zoneId
    UpdateMeetingResponse:
      type: object
      description: Updated meeting snapshot
      properties:
        meeting:
          $ref: "#/components/schemas/UpdatedMeetingSnapshot"
    UpdatedMeetingSnapshot:
      type: object
      description: Updated meeting snapshot
      properties:
        id:
          type: string
          format: uuid
        hostId:
          type: string
        shortCode:
          type: string
        type:
          type: string
        status:
          type: string
        title:
          type: string
        description:
          type: string
        issueLink:
          $ref: "#/components/schemas/IssueLink"
        settings:
          $ref: "#/components/schemas/Settings"
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        zoneId:
          type: string
        organizerEmail:
          type: string
        organizerDisplayName:
          type: string
        calendarUid:
          type: string
        calendarSequence:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
    Violation:
      type: object
      description: Field-level validation error
      properties:
        field:
          type: string
          description: Request field that failed validation
          example: app.id
        code:
          type: string
          description: Machine-readable violation category
          enum:
          - REQUIRED
          - INVALID_FORMAT
          - TOO_SHORT
          - TOO_LONG
          - INVALID_VALUE
          example: REQUIRED
        message:
          type:
          - string
          - "null"
          description: Server-localized human-readable message
          example: must not be blank
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details response body
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
          example: about:blank
        title:
          type: string
          description: Short human-readable summary of the problem
          example: Bad Request
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          example: The request body failed validation
        code:
          type: string
          description: Machine-readable error code
          example: VALIDATION_ERROR
        traceId:
          type: string
          description: Distributed trace identifier for correlation
          example: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        errors:
          type: array
          description: Field-level validation errors (present when code is VALIDATION_ERROR)
          items:
            $ref: "#/components/schemas/Violation"
    Invitee:
      type: object
      description: Meeting invitee
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        accountId:
          type: string
          minLength: 1
        displayName:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - accountId
      - displayName
      - email
    UpdateMeetingInviteesRequest:
      type: object
      description: Request body for replacing the invitee list of a meeting
      properties:
        invitees:
          type: array
          description: Full invitee list to synchronize
          items:
            $ref: "#/components/schemas/Invitee"
      required:
      - invitees
    MeetingInviteeSnapshot:
      type: object
      description: Meeting invitee snapshot
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
        status:
          type: string
        invitedAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
    UpdateMeetingInviteesResponse:
      type: object
      description: Response containing the current active invitee list of a meeting
      properties:
        invitees:
          type: array
          items:
            $ref: "#/components/schemas/MeetingInviteeSnapshot"
    ScheduleMeetingRequest:
      type: object
      description: Request body for creating a scheduled meeting
      properties:
        title:
          type: string
          description: Meeting title
          example: Sprint Planning
          minLength: 1
        description:
          type: string
          description: Meeting description
          example: Weekly sprint planning session
          minLength: 1
        issueLink:
          $ref: "#/components/schemas/IssueLink"
        settings:
          $ref: "#/components/schemas/Settings"
        timeRange:
          $ref: "#/components/schemas/TimeRange"
        organizerEmail:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        organizerDisplayName:
          type: string
          maxLength: 255
          minLength: 0
        zoneId:
          type: string
          description: Host IANA time zone id
          example: Asia/Ho_Chi_Minh
          minLength: 1
        invitees:
          type:
          - array
          - "null"
          items:
            $ref: "#/components/schemas/Invitee"
      required:
      - description
      - issueLink
      - organizerDisplayName
      - organizerEmail
      - settings
      - timeRange
      - title
      - zoneId
    ScheduleMeetingResponse:
      type: object
      description: Response for a successfully created scheduled meeting
      properties:
        meeting:
          $ref: "#/components/schemas/ScheduledMeetingSnapshot"
    ScheduledMeetingSnapshot:
      type: object
      description: Scheduled meeting snapshot
      properties:
        id:
          type: string
          format: uuid
        hostId:
          type: string
        shortCode:
          type: string
        type:
          type: string
        status:
          type: string
        title:
          type: string
        description:
          type: string
        issueLink:
          $ref: "#/components/schemas/IssueLink"
        settings:
          $ref: "#/components/schemas/Settings"
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        zoneId:
          type: string
        organizerEmail:
          type: string
        organizerDisplayName:
          type: string
        calendarUid:
          type: string
        calendarSequence:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
    CreateInstantMeetingRequest:
      type: object
      description: Request body for creating an instant meeting
      properties:
        title:
          type: string
          description: Meeting title
          example: Sprint Planning
          minLength: 1
        description:
          type: string
          description: Meeting description
          example: Daily standup for the team
          minLength: 1
        issueLink:
          $ref: "#/components/schemas/IssueLink"
        settings:
          $ref: "#/components/schemas/Settings"
        host:
          $ref: "#/components/schemas/Host"
        organizerEmail:
          type: string
          format: email
          description: Organizer email address
          example: alice@example.com
          maxLength: 255
          minLength: 0
        organizerDisplayName:
          type: string
          description: Organizer display name
          example: Alice Nguyen
          maxLength: 255
          minLength: 0
        zoneId:
          type: string
          description: Host IANA time zone id
          example: Asia/Ho_Chi_Minh
          minLength: 1
        invitees:
          type:
          - array
          - "null"
          items:
            $ref: "#/components/schemas/Invitee"
      required:
      - description
      - host
      - issueLink
      - organizerDisplayName
      - organizerEmail
      - settings
      - title
      - zoneId
    Host:
      type: object
      description: Host participant info
      properties:
        displayName:
          type: string
          minLength: 1
        deviceId:
          type: string
          minLength: 1
        avatarUrl:
          type:
          - string
          - "null"
          description: Host avatar URL
      required:
      - deviceId
      - displayName
    CreateInstantMeetingResponse:
      type: object
      description: Response for a successfully created instant meeting
      properties:
        meeting:
          $ref: "#/components/schemas/InstantMeetingSnapshot"
        livekit:
          $ref: "#/components/schemas/LiveKit"
    InstantMeetingSnapshot:
      type: object
      description: Instant meeting snapshot
      properties:
        id:
          type: string
          format: uuid
        hostId:
          type: string
        shortCode:
          type: string
        type:
          type: string
        status:
          type: string
        title:
          type: string
        description:
          type: string
        issueLink:
          $ref: "#/components/schemas/IssueLink"
        settings:
          $ref: "#/components/schemas/Settings"
        zoneId:
          type: string
        organizerEmail:
          type: string
        organizerDisplayName:
          type: string
        createdAt:
          type: string
          format: date-time
    LiveKit:
      type: object
      description: LiveKit access details for the host
      properties:
        token:
          type: string
        roomName:
          type: string
