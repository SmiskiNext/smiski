openapi: 3.1.0
info:
  title: Meet
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: API Gateway
paths:
  /api/{version}/meetings:schedule:
    post:
      tags:
      - meeting-controller
      summary: Create a scheduled meeting
      description: Creates a new SCHEDULED meeting with a future time range. The meeting
        stays in SCHEDULED status and no LiveKit token is issued.
      operationId: schedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleMeetingRequest"
        required: true
      responses:
        "201":
          description: Scheduled meeting created
          headers:
            Location:
              description: URI of the newly created meeting
              style: simple
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleMeetingResponse"
        "400":
          description: "Validation error, missing account header, or start time in\
            \ past"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                validationError:
                  summary: Validation failure
                  description: validationError
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: The request body failed validation
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
                    errors:
                    - field: settings
                      code: REQUIRED
                      message: must not be null
                startTimeInPast:
                  summary: Start time is in the past
                  description: startTimeInPast
                  value:
                    type: about:blank
                    title: Start time is in the past
                    status: 400
                    detail: "The scheduled start time is in the past: {0}."
                    code: MEETING_START_IN_PAST
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    parameters:
    - name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: 1
  /api/{version}/meetings:instant:
    post:
      tags:
      - meeting-controller
      summary: Create an instant meeting
      description: "Creates a new INSTANT meeting, auto-starts it to RUNNING, registers\
        \ invitees with invite tokens, and returns a meeting snapshot plus a LiveKit\
        \ HOST access token."
      operationId: createInstant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstantMeetingRequest"
        required: true
      responses:
        "201":
          description: Instant meeting created
          headers:
            Location:
              description: URI of the newly created meeting
              style: simple
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInstantMeetingResponse"
        "400":
          description: Validation error or missing account header
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                validationError:
                  summary: Validation failure
                  description: validationError
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: The request body failed validation
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
                    errors:
                    - field: settings
                      code: REQUIRED
                      message: must not be null
                missingAccount:
                  summary: Missing X-Account-Id header
                  description: missingAccount
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: X-Account-Id header is required
                    code: VALIDATION_ERROR
                    traceId: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "405":
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    parameters:
    - name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: 1
components:
  schemas:
    Invitee:
      type: object
      description: Meeting invitee
      properties:
        email:
          type: string
          format: email
          minLength: 1
        accountId:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
      required:
      - accountId
      - displayName
      - email
    IssueLink:
      type: object
      properties:
        issueId:
          type: string
        issueKey:
          type: string
        projectKey:
          type: string
    ScheduleMeetingRequest:
      type: object
      description: Request body for creating a scheduled meeting
      properties:
        title:
          type: string
          description: Meeting title
          example: Sprint Planning
          minLength: 1
        description:
          type: string
          description: Meeting description
          example: Weekly sprint planning session
          minLength: 1
        issueLink:
          $ref: "#/components/schemas/IssueLink"
        settings:
          $ref: "#/components/schemas/Settings"
        timeRange:
          $ref: "#/components/schemas/TimeRange"
        invitees:
          type:
          - array
          - "null"
          items:
            $ref: "#/components/schemas/Invitee"
      required:
      - description
      - issueLink
      - settings
      - timeRange
      - title
    Settings:
      type: object
      properties:
        admissionPolicy:
          type: string
        maxParticipants:
          type: integer
          format: int32
        allowScreenShare:
          type: boolean
        chatEnabled:
          type: boolean
        allowMicrophone:
          type: boolean
        allowVideo:
          type: boolean
    TimeRange:
      type: object
      description: Scheduled time range
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
      required:
      - endTime
      - startTime
    Meeting:
      type: object
      description: Meeting snapshot
      properties:
        id:
          type: string
          format: uuid
        hostId:
          type: string
        shortCode:
          type: string
        type:
          type: string
        status:
          type: string
        title:
          type: string
        description:
          type: string
        issueLink:
          $ref: "#/components/schemas/IssueLink"
        settings:
          $ref: "#/components/schemas/Settings"
        createdAt:
          type: string
          format: date-time
    ScheduleMeetingResponse:
      type: object
      description: Response for a successfully created scheduled meeting
      properties:
        meeting:
          $ref: "#/components/schemas/Meeting"
    Violation:
      type: object
      description: Field-level validation error
      properties:
        field:
          type: string
          description: Request field that failed validation
          example: app.id
        code:
          type: string
          description: Machine-readable violation category
          enum:
          - REQUIRED
          - INVALID_FORMAT
          - TOO_SHORT
          - TOO_LONG
          - INVALID_VALUE
          example: REQUIRED
        message:
          type:
          - string
          - "null"
          description: Server-localized human-readable message
          example: must not be blank
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details response body
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
          example: about:blank
        title:
          type: string
          description: Short human-readable summary of the problem
          example: Bad Request
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          example: The request body failed validation
        code:
          type: string
          description: Machine-readable error code
          example: VALIDATION_ERROR
        traceId:
          type: string
          description: Distributed trace identifier for correlation
          example: 6d3e5f1a2b4c7d8e9f0a1b2c3d4e5f6a
        errors:
          type: array
          description: Field-level validation errors (present when code is VALIDATION_ERROR)
          items:
            $ref: "#/components/schemas/Violation"
    CreateInstantMeetingRequest:
      type: object
      description: Request body for creating an instant meeting
      properties:
        title:
          type: string
          description: Meeting title
          example: Sprint Planning
          minLength: 1
        description:
          type: string
          description: Meeting description
          example: Daily standup for the team
          minLength: 1
        issueLink:
          $ref: "#/components/schemas/IssueLink"
        settings:
          $ref: "#/components/schemas/Settings"
        host:
          $ref: "#/components/schemas/Host"
        invitees:
          type:
          - array
          - "null"
          items:
            $ref: "#/components/schemas/Invitee"
      required:
      - description
      - host
      - issueLink
      - settings
      - title
    Host:
      type: object
      description: Host participant info
      properties:
        displayName:
          type: string
          minLength: 1
        deviceId:
          type: string
          minLength: 1
        avatarUrl:
          type:
          - string
          - "null"
          description: Host avatar URL
      required:
      - deviceId
      - displayName
    CreateInstantMeetingResponse:
      type: object
      description: Response for a successfully created instant meeting
      properties:
        meeting:
          $ref: "#/components/schemas/Meeting"
        livekit:
          $ref: "#/components/schemas/LiveKit"
    LiveKit:
      type: object
      description: LiveKit access details for the host
      properties:
        token:
          type: string
        roomName:
          type: string
