spring:
    application:
        name: meet

    mvc:
        apiversion:
            use:
                path-segment: 1
            default: 1
            supported: 1

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zms_meetings}
        username: zms_user
        password: zms_secret
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
        enabled: true
        locations: classpath:db/migration

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            acks: all
            retries: 3
            properties:
                enable.idempotence: true
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: io.cloudevents.kafka.CloudEventSerializer

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD:}

    threads:
        virtual:
            enabled: true

app:
    tenancy:
        header: X-Tenant-ID
        default-tenant: system
    identity:
        header: X-Account-Id
    livekit:
        url: ${LIVEKIT_URL:http://localhost:7880}
        ws-url: ${LIVEKIT_WS_URL:ws://localhost:7880}
        api-key: ${LIVEKIT_API_KEY:zms-livekit-key}
        api-secret: ${LIVEKIT_API_SECRET:change-me-livekit-secret-must-be-at-least-32-chars}
        webhook-url: ${LIVEKIT_WEBHOOK_URL:http://localhost:8080/api/1/webhooks/livekit}
        webhook-topic: ${LIVEKIT_WEBHOOK_TOPIC:meet.livekit.webhook.internal}
        webhook-consumer-group: ${LIVEKIT_WEBHOOK_CONSUMER_GROUP:meet-livekit-webhook}
        token-expiry-seconds: 1800
        recording:
            layout: ${LIVEKIT_RECORDING_LAYOUT:speaker}
            bucket: ${LIVEKIT_RECORDING_BUCKET:recordings}
            region: ${LIVEKIT_RECORDING_REGION:us-east-1}
            endpoint: ${LIVEKIT_RECORDING_PUBLIC_ENDPOINT:http://localhost:9000}
            egress-endpoint: ${LIVEKIT_RECORDING_EGRESS_ENDPOINT:http://rustfs:9000}
            access-key: ${LIVEKIT_RECORDING_ACCESS_KEY:${RUSTFS_ACCESS_KEY:rustfs-access-key}}
            secret-key: ${LIVEKIT_RECORDING_SECRET_KEY:${RUSTFS_SECRET_KEY:rustfs-secret-key}}
            force-path-style: ${LIVEKIT_RECORDING_FORCE_PATH_STYLE:true}
            pending-max-age: ${LIVEKIT_RECORDING_PENDING_MAX_AGE:PT7M}
    sse:
        timeout-ms: 300000
        join-request-timeout-ms: 600000
    cursor:
        secret: ${CURSOR_SECRET}
    short-code:
        alphabet: ${MEET_SHORT_CODE_ALPHABET:0123456789abcdefghijklmnopqrstuvwxyz}
        length: ${MEET_SHORT_CODE_LENGTH:10}
        max-attempts: ${MEET_SHORT_CODE_MAX_ATTEMPTS:10}

smiski:
    outbox:
        transport: kafka
        relay:
            enabled: true
            fixed-delay: PT5S
            batch-size: 50
        cloudevent:
            source: meet-service
    meet:
        no-show-canceler:
            fixed-delay: PT5M
            batch-size: 100

logging:
    aspect:
        include-args: false

springdoc:
    api-docs:
        enabled: true
    swagger-ui:
        enabled: false
