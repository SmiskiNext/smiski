spring:
    application:
        name: meet

    mvc:
        apiversion:
            use:
                path-segment: 1
            default: 1
            supported: 1

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meet}
        username: ${POSTGRES_USER:smiski_user}
        password: ${POSTGRES_PASSWORD:smiski_secret}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
        enabled: true
        locations: classpath:db/migration

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            acks: all
            retries: 3
            properties:
                enable.idempotence: true
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: io.cloudevents.kafka.CloudEventSerializer

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD:}

    threads:
        virtual:
            enabled: true

management:
    endpoints:
        web:
            exposure:
                include: health,prometheus

app:
    tenant:
        kafka:
            installed-consumer-group: ${TENANT_INSTALLED_CONSUMER_GROUP:meet-tenant-installed}
            uninstalled-consumer-group: ${TENANT_UNINSTALLED_CONSUMER_GROUP:meet-tenant-uninstalled}
            retry-attempts: ${TENANT_KAFKA_RETRY_ATTEMPTS:3}
            retry-backoff-ms: ${TENANT_KAFKA_RETRY_BACKOFF_MS:1000}
            dead-letter-suffix: ${TENANT_KAFKA_DLT_SUFFIX:.dlt}
    livekit:
        url: ${LIVEKIT_URL:http://localhost:7880}
        ws-url: ${LIVEKIT_WS_URL:ws://localhost:7880}
        api-key: ${LIVEKIT_API_KEY:smiski-livekit-key}
        api-secret: ${LIVEKIT_API_SECRET:change-me-livekit-secret-must-be-at-least-32-chars}
        webhook-url: ${LIVEKIT_WEBHOOK_URL:http://localhost:8080/api/1/webhooks/livekit}
        webhook-topic: ${LIVEKIT_WEBHOOK_TOPIC:meet.livekit.webhook.internal}
        webhook-consumer-group: ${LIVEKIT_WEBHOOK_CONSUMER_GROUP:meet-livekit-webhook}
        token-expiry-seconds: 1800
    sse:
        timeout-ms: 300000
        join-request-timeout-ms: 600000
    cursor:
        secret: ${CURSOR_SECRET}
    meet:
        instant:
            default-duration: ${MEET_INSTANT_DEFAULT_DURATION:PT1H}
        no-show-canceler:
            fixed-delay: PT5M
            batch-size: 100
    short-code:
        alphabet: ${MEET_SHORT_CODE_ALPHABET:0123456789abcdefghijklmnopqrstuvwxyz}
        length: ${MEET_SHORT_CODE_LENGTH:10}
        max-attempts: ${MEET_SHORT_CODE_MAX_ATTEMPTS:10}
    outbox:
        transport: kafka
        relay:
            enabled: true
            fixed-delay: PT5S
            batch-size: 50
        cloudevent:
            source: meet-service
    logging:
        aspect:
            include-args: false

springdoc:
    api-docs:
        enabled: true
    swagger-ui:
        enabled: false
