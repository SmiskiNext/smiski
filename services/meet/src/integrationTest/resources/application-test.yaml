spring:
    jpa:
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
        enabled: true
        locations: classpath:db/migration

smiski:
    outbox:
        relay:
            fixed-delay: PT60S

app:
    cursor:
        secret: test-cursor-secret-fixed-value-for-tests
    livekit:
        url: http://localhost:7880
        ws-url: ws://localhost:7880
        api-key: test-livekit-key
        api-secret: test-livekit-secret-must-be-at-least-32-chars
        webhook-url: http://localhost:8080/api/1/webhooks/livekit
        webhook-topic: meet.livekit.webhook.internal
        webhook-consumer-group: meet-livekit-webhook-test
        token-expiry-seconds: 1800
        recording:
            layout: speaker
            bucket: recordings
            region: us-east-1
            endpoint: http://localhost:9000
            egress-endpoint: http://localhost:9000
            access-key: test-access-key
            secret-key: test-secret-key
            force-path-style: true
            pending-max-age: PT7M
    sse:
        timeout-ms: 300000
        join-request-timeout-ms: 600000
