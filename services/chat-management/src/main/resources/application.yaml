spring:
    application:
        name: chat-management
    mvc:
        apiversion:
            use:
                path-segment: 1
            default: 1.0
            supported: 1.0
    data:
        mongodb:
            uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/chat_management}
    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
    port: 8080

app:
    livekit:
        url: ${LIVEKIT_URL:http://localhost:7880}
        api-key: ${LIVEKIT_API_KEY:}
        api-secret: ${LIVEKIT_API_SECRET:}
    chat:
        jwt-secret: ${CHAT_JWT_SECRET:changeme}
        limits:
            max-message-length: 4000
    cursor:
        secret: ${CURSOR_SECRET:}

logging:
    level:
        root: ${SPRING_LOG_LEVEL_ROOT:INFO}
        io.github.phunguy65.zms.chatmanagement: ${SPRING_LOG_LEVEL_ROOT:INFO}

springdoc:
    api-docs:
        enabled: true
    swagger-ui:
        enabled: false
    servers:
        - url: ${GATEWAY_URL:http://localhost:8080}
          description: API Gateway
