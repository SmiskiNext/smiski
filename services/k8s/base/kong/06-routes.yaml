# ─── Public route: /api/v1/meetings:byShortCode (guest lookup) ───────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: meetings-byshortcode-public
    namespace: default
    annotations:
        konghq.com/plugins: cors-local,rate-limit-strict
spec:
    parentRefs:
        - name: kong-gateway
          namespace: kong-system
    rules:
        - matches:
              - path:
                    type: Exact
                    value: /api/v1/meetings:byShortCode
                method: GET
          backendRefs:
              - name: meeting-management
                port: 8080
---
