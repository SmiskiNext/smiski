# ─── Public routes: /api/v1/auth/* (no JWT required) ─────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: auth-public
    namespace: default
    annotations:
        konghq.com/plugins: cors-local
spec:
    parentRefs:
        - name: kong-gateway
          namespace: kong-system
    rules:
        - matches:
              - path:
                    type: PathPrefix
                    value: /api/v1/auth
          backendRefs:
              - name: user-management
                port: 8080
---
# ─── Protected routes: /api/v1/users/* ───────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: users-protected
    namespace: default
    annotations:
        konghq.com/plugins: cors-local,jwt-auth,inject-user-id,rate-limit-standard
spec:
    parentRefs:
        - name: kong-gateway
          namespace: kong-system
    rules:
        - matches:
              - path:
                    type: PathPrefix
                    value: /api/v1/users
          backendRefs:
              - name: user-management
                port: 8080
---
