# ClusterIP — internal access for LiveKit Egress
apiVersion: v1
kind: Service
metadata:
    name: rustfs
    namespace: rustfs-system
    labels:
        app: rustfs
spec:
    type: ClusterIP
    selector:
        app: rustfs
    ports:
        - name: api
          port: 9000
          targetPort: 9000
        - name: console
          port: 9001
          targetPort: 9001
---
# NodePort — expose console UI for local access
# Access at http://<node-ip>:30901
apiVersion: v1
kind: Service
metadata:
    name: rustfs-console
    namespace: rustfs-system
    labels:
        app: rustfs
spec:
    type: NodePort
    selector:
        app: rustfs
    ports:
        - name: console
          port: 9001
          targetPort: 9001
          nodePort: 30901
