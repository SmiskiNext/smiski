# Job to create the `recordings` bucket on first deploy
# Runs once using the mc (MinIO Client) tool — compatible with RustFS S3 API
apiVersion: batch/v1
kind: Job
metadata:
    name: rustfs-init-buckets
    namespace: rustfs-system
spec:
    template:
        spec:
            restartPolicy: OnFailure
            initContainers:
                - name: wait-for-rustfs
                  image: busybox:1.36
                  command:
                      - sh
                      - -c
                      - |
                          until wget -q -O- http://rustfs:9000/minio/health/ready; do
                            echo "Waiting for RustFS..."; sleep 3;
                          done
            containers:
                - name: mc
                  image: minio/mc:latest
                  env:
                      - name: ACCESS_KEY
                        valueFrom:
                            secretKeyRef:
                                name: rustfs-credentials
                                key: access-key
                      - name: SECRET_KEY
                        valueFrom:
                            secretKeyRef:
                                name: rustfs-credentials
                                key: secret-key
                  command:
                      - sh
                      - -c
                      - |
                          mc alias set rustfs http://rustfs:9000 $ACCESS_KEY $SECRET_KEY
                          mc mb --ignore-existing rustfs/recordings
                          mc mb --ignore-existing rustfs/avatars
                          echo "Buckets initialized."
