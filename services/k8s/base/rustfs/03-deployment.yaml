apiVersion: apps/v1
kind: Deployment
metadata:
    name: rustfs
    namespace: rustfs-system
    labels:
        app: rustfs
spec:
    replicas: 1
    selector:
        matchLabels:
            app: rustfs
    template:
        metadata:
            labels:
                app: rustfs
        spec:
            containers:
                - name: rustfs
                  image: rustfs/rustfs:latest
                  ports:
                      - name: api
                        containerPort: 9000
                      - name: console
                        containerPort: 9001
                  env:
                      - name: RUSTFS_ACCESS_KEY
                        valueFrom:
                            secretKeyRef:
                                name: rustfs-credentials
                                key: access-key
                      - name: RUSTFS_SECRET_KEY
                        valueFrom:
                            secretKeyRef:
                                name: rustfs-credentials
                                key: secret-key
                      - name: RUSTFS_VOLUMES
                        value: '/data'
                      - name: RUSTFS_ADDRESS
                        value: ':9000'
                      - name: RUSTFS_CONSOLE_ADDRESS
                        value: ':9001'
                  volumeMounts:
                      - name: data
                        mountPath: /data
                  resources:
                      requests:
                          cpu: 100m
                          memory: 128Mi
                      limits:
                          cpu: 500m
                          memory: 512Mi
                  readinessProbe:
                      httpGet:
                          path: /minio/health/ready
                          port: 9000
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /minio/health/live
                          port: 9000
                      initialDelaySeconds: 20
                      periodSeconds: 20
            volumes:
                - name: data
                  persistentVolumeClaim:
                      claimName: rustfs-data-pvc
