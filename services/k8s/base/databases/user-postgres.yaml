# user-postgres — PostgreSQL for user-management service
apiVersion: apps/v1
kind: Deployment
metadata:
    name: user-postgres
    namespace: default
    labels:
        app: user-postgres
spec:
    replicas: 1
    selector:
        matchLabels:
            app: user-postgres
    template:
        metadata:
            labels:
                app: user-postgres
        spec:
            containers:
                - name: postgres
                  image: postgres:18-alpine
                  ports:
                      - containerPort: 5432
                  env:
                      - name: POSTGRES_DB
                        value: zms_users
                      - name: POSTGRES_USER
                        valueFrom:
                            secretKeyRef:
                                name: user-management-secrets
                                key: db-username
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: user-management-secrets
                                key: db-password
                  volumeMounts:
                      - name: data
                        mountPath: /var/lib/postgresql
                  readinessProbe:
                      exec:
                          command:
                              - pg_isready
                              - -d
                              - zms_users
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      exec:
                          command:
                              - pg_isready
                              - -d
                              - zms_users
                      initialDelaySeconds: 15
                      periodSeconds: 20
                  resources:
                      requests:
                          cpu: 50m
                          memory: 128Mi
                      limits:
                          cpu: 200m
                          memory: 256Mi
            volumes:
                - name: data
                  persistentVolumeClaim:
                      claimName: user-postgres-data
---
apiVersion: v1
kind: Service
metadata:
    name: user-management-postgres
    namespace: default
    labels:
        app: user-postgres
spec:
    type: ClusterIP
    selector:
        app: user-postgres
    ports:
        - port: 5432
          targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: user-postgres-data
    namespace: default
spec:
    accessModes:
        - ReadWriteOnce
    storageClassName: standard
    resources:
        requests:
            storage: 1Gi
