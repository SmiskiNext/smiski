# Promtail Helm values — grafana/promtail
# https://grafana.com/docs/loki/latest/send-data/promtail/installation/

config:
    logLevel: info
    serverPort: 3101
    clients:
        - url: http://loki:3100/loki/api/v1/push

    snippets:
        pipelineStages:
            # Parse JSON log lines (ECS format on k8s profile)
            - json:
                  expressions:
                      level: log.level
                      message: message
                      timestamp: '@timestamp'
            # Promote log level as a label for filtering
            - labels:
                  level:
            # Collapse multiline Java stack traces into a single entry
            - multiline:
                  firstline: '^\d{4}-\d{2}-\d{2}'
                  max_wait_time: 3s

defaultVolumes:
    - name: pods-logs
      hostPath:
          path: /var/log/pods

defaultVolumeMounts:
    - name: pods-logs
      mountPath: /var/log/pods
      readOnly: true
