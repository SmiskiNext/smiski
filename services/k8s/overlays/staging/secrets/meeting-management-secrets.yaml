apiVersion: v1
kind: Secret
metadata:
    name: meeting-management-secrets
    namespace: default
type: Opaque
stringData:
    db-username: 'zms_user'
    db-password: 'zms_secret'
    cursor-secret: 'change-me-cursor-secret-must-be-at-least-32-chars'
    livekit-api-key: 'zms-livekit-key'
    livekit-api-secret: 'change-me-livekit-secret-must-be-at-least-32-chars'
    recording-s3-access-key: 'rustfs-access-key'
    recording-s3-secret-key: 'rustfs-secret-key-change-me'
