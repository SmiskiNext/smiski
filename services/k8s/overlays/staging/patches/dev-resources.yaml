# Dev resource limits — reduced for local k3s (~4.5Gi RAM budget)
# Applied as strategic merge patches via Kustomize
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: user-management
    namespace: default
spec:
    template:
        spec:
            containers:
                - name: user-management
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          cpu: 300m
                          memory: 768Mi
