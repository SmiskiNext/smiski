spring:
    jpa:
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
        enabled: true
        locations: classpath:db/migration

app:
    cursor:
        secret: test-cursor-secret-fixed-value-for-tests
    forge:
        app-id: ari:cloud:ecosystem::app/test
        jwks-uri: https://example.com/.well-known/jwks.json
        environment-type: DEVELOPMENT
        clock-skew-seconds: 10
    livekit:
        url: http://localhost:7880
        ws-url: ws://localhost:7880
        api-key: test-livekit-key
        api-secret: test-livekit-secret-must-be-at-least-32-chars
        webhook-url: http://localhost:8080/api/v1/webhook/livekit
        token-expiry-seconds: 1800
        recording:
            layout: speaker
            bucket: recordings
            region: us-east-1
            endpoint: http://localhost:9000
            egress-endpoint: http://localhost:9000
            access-key: test-access-key
            secret-key: test-secret-key
            force-path-style: true
            pending-max-age: PT7M
