spring:
    application:
        name: record

    mvc:
        apiversion:
            use:
                path-segment: 1
            default: 1.0
            supported: 1.0

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zms_recordings}
        username: zms_user
        password: zms_secret
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
        enabled: true
        locations: classpath:db/migration

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            acks: all
            retries: 3
            properties:
                enable.idempotence: true
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: io.cloudevents.kafka.CloudEventSerializer

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD:}

    threads:
        virtual:
            enabled: true

    grpc:
        client:
            channels:
                user-management:
                    address: static://${USER_MANAGEMENT_GRPC_HOST:localhost}:${USER_MANAGEMENT_GRPC_PORT:9090}
                    negotiation-type: ${GRPC_NEGOTIATION_TYPE:plaintext}

app:
    tenancy:
        header: X-Tenant-ID
        default-tenant: system
    forge:
        app-id: ${FORGE_APP_ID:ari:cloud:ecosystem::app/change-me}
        jwks-uri: ${FORGE_JWKS_URI:https://forge.cdn.prod.atlassian-dev.net/.well-known/jwks.json}
        environment-type: ${FORGE_ENVIRONMENT_TYPE:DEVELOPMENT}
        clock-skew-seconds: ${FORGE_CLOCK_SKEW_SECONDS:10}
    livekit:
        url: ${LIVEKIT_URL:http://localhost:7880}
        ws-url: ${LIVEKIT_WS_URL:ws://localhost:7880}
        api-key: ${LIVEKIT_API_KEY:zms-livekit-key}
        api-secret: ${LIVEKIT_API_SECRET:change-me-livekit-secret-must-be-at-least-32-chars}
        webhook-url: ${LIVEKIT_WEBHOOK_URL:http://localhost:8080/api/v1/webhook/livekit}
        token-expiry-seconds: 1800
        recording:
            layout: ${LIVEKIT_RECORDING_LAYOUT:speaker}
            bucket: ${LIVEKIT_RECORDING_BUCKET:recordings}
            region: ${LIVEKIT_RECORDING_REGION:us-east-1}
            endpoint: ${LIVEKIT_RECORDING_PUBLIC_ENDPOINT:http://localhost:9000}
            egress-endpoint: ${LIVEKIT_RECORDING_EGRESS_ENDPOINT:http://rustfs:9000}
            access-key: ${LIVEKIT_RECORDING_ACCESS_KEY:${RUSTFS_ACCESS_KEY:rustfs-access-key}}
            secret-key: ${LIVEKIT_RECORDING_SECRET_KEY:${RUSTFS_SECRET_KEY:rustfs-secret-key}}
            force-path-style: ${LIVEKIT_RECORDING_FORCE_PATH_STYLE:true}
            pending-max-age: ${LIVEKIT_RECORDING_PENDING_MAX_AGE:PT7M}
    cursor:
        secret: ${CURSOR_SECRET}

logging:
    aspect:
        include-args: false

springdoc:
    api-docs:
        enabled: true
    swagger-ui:
        enabled: false
