# ---------------------------------------------------------------------------
# Localized error text for application/problem+json responses (English default)
#
# Keys follow: error.<kebab-case-code>.title / error.<kebab-case-code>.detail
# where <code> is the ErrorCode.code(). Positional args {0}, {1}, ... are
# filled from DomainError.messageArgs().
# ---------------------------------------------------------------------------

# --- Common (infrastructure) --------------------------------------------------
error.validation-error.title=Validation failed
error.validation-error.detail=One or more fields are invalid.
error.malformed-request.title=Malformed request
error.malformed-request.detail=The request body could not be read.
error.missing-parameter.title=Missing parameter
error.missing-parameter.detail=A required request parameter is missing.
error.method-not-allowed.title=Method not allowed
error.method-not-allowed.detail=The HTTP method is not supported for this resource.
error.unsupported-media-type.title=Unsupported media type
error.unsupported-media-type.detail=The request content type is not supported.
error.resource-not-found.title=Resource not found
error.resource-not-found.detail=The requested resource does not exist.
error.internal-error.title=Internal server error
error.internal-error.detail=An unexpected error occurred. Please try again later.

# --- Cursor pagination --------------------------------------------------------
error.invalid-cursor.title=Invalid page cursor
error.invalid-cursor.detail=The page cursor is invalid; restart from the first page.

# --- Field violation categories (client-facing per-field messages) ------------
violation.required=This field is required.
violation.invalid-format=This field has an invalid format.
violation.too-short=This value is too short.
violation.too-long=This value is too long.
violation.invalid-value=This value is not allowed.

# --- Bean Validation constraint overrides (locale-aware via MessageSource) ----
jakarta.validation.constraints.NotNull.message=must not be null
jakarta.validation.constraints.NotBlank.message=must not be blank
jakarta.validation.constraints.NotEmpty.message=must not be empty
jakarta.validation.constraints.Email.message=must be a valid email address
jakarta.validation.constraints.Size.message=size must be between {min} and {max}
jakarta.validation.constraints.Min.message=must be greater than or equal to {value}
jakarta.validation.constraints.Max.message=must be less than or equal to {value}
jakarta.validation.constraints.Pattern.message=must match the required pattern
