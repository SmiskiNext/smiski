modules:
  jira:issuePanel:
    - key: smiski-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: smiski
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/253a4c6c-4a64-40b1-bb43-b88cde614029
