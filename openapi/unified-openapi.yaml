          type: integer
          format: int64
    ChatManagement_ChatMessageResponse:
      type: object
      properties:
        id:
          type: string
        seqNum:
          type: integer
          format: int64
        roomId:
          type: string
        senderId:
          type: string
        senderName:
          type: string
        content:
          type: string
        type:
          type: string
        createdAt:
          type: string
          format: date-time
    ChatManagement_ChatRoomResponse:
      type: object
      properties:
        roomId:
          type: string
        meetingId:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    ChatManagement_CursorScrollResponseChatMessageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ChatManagement_ChatMessageResponse'
        size:
          type: integer
