          type: string
          format: date-time
    MeetingManagement_OffsetScrollResponseJoinRequestResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MeetingManagement_JoinRequestResponse'
        size:
          type: integer
          format: int32
        nextOffset:
          type: integer
          format: int32
    MeetingManagement_SseEmitter:
      type: object
