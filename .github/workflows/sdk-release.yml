name: SDK Release

on:
    push:
        branches: [dev]

permissions:
    contents: write
    packages: write
    pull-requests: write

concurrency:
    group: sdk-release-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Create or publish SDK release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  fetch-depth: 0

            - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4

            - name: Configure GitHub Packages
              uses: ./.github/actions/configure-github-packages
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Pushes release commits through the GitHub API rather than the Git
            # CLI, so the token never competes with the Authorization header
            # that actions/checkout persists in the repository config.
            - name: Create release PR or publish SDK
              id: changesets
              uses: changesets/action@d0ee272882939fa35f22d979828acb7e61e0bd47 # v2.0.0-next.4
              with:
                  publish-script: pnpm release:sdk
                  pr-title: 'chore(sdk): release SDK'
                  commit-message: 'chore(sdk): release SDK'
                  pr-base-branch: dev
                  create-github-releases: false
                  # Release tags stay local to the runner. Pushing them would
                  # break `git cliff --bumped-version` in the backend release
                  # workflow, which matches any tag containing a version.
                  push-git-tags: false
