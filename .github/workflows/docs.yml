name: Docs

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - dev
            - 'feat/**'
        paths:
            - 'docs/**'
            - 'services/openapi.yaml'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.mise.toml'
            - '.github/workflows/docs.yml'
    pull_request:
        branches: [main, dev]
        paths:
            - 'docs/**'
            - 'services/openapi.yaml'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.mise.toml'
            - '.github/workflows/docs.yml'

permissions:
    contents: read
    deployments: write # required to publish the Cloudflare deployment status

concurrency:
    group: docs-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build docs
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4

            - name: Get pnpm store directory
              id: pnpm-store
              run:
                  echo "STORE_PATH=$(pnpm store path --silent)" >>
                  "$GITHUB_OUTPUT"

            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
                  key:
                      ${{ runner.os }}-pnpm-store-${{
                      hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck docs
              run: pnpm run typecheck
              working-directory: docs

            - name: Build Docusaurus site
              run: pnpm run build
              working-directory: docs
              env:
                  CI: 'true'

            - name: Upload build artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: docs-build
                  path: docs/build
                  if-no-files-found: error
                  retention-days: 1

    deploy:
        name: Deploy to Cloudflare Pages
        needs: build
        # Pushes deploy automatically; pull requests only build and typecheck.
        if:
            github.event_name == 'push' || github.event_name ==
            'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4

            - name: Install deployment dependencies
              run: pnpm install --frozen-lockfile --filter @smiskinext/docs

            - name: Download build artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: docs-build
                  path: docs/build

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  packageManager: pnpm
                  workingDirectory: docs
                  wranglerVersion: '4.114.0'
                  command: >-
                      pages deploy build --project-name=smiski-docs --branch=${{
                      github.ref_name }}
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}
