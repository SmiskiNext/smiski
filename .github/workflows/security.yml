name: Security

on:
    pull_request:
        branches: [dev, main]
    push:
        branches: [dev, main]

permissions:
    contents: read

concurrency:
    group: security-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    gitleaks:
        name: Gitleaks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  fetch-depth: 0

            - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4

            - name: Gitleaks detect
              env:
                  BASE_SHA:
                      ${{ github.event.pull_request.base.sha ||
                      github.event.before }}
                  HEAD_SHA:
                      ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
                    gitleaks detect --config .gitleaks.toml
                  else
                    gitleaks detect --config .gitleaks.toml --log-opts="$BASE_SHA..$HEAD_SHA"
                  fi

    security-success:
        name: Security Success
        needs: [gitleaks]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check results
              run: |
                  if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
                    echo "::error::Security scan failed or was cancelled."
                    exit 1
                  fi
                  echo "Security scan passed."
