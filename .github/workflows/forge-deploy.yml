name: Deploy Forge app

on:
    push:
        branches: [dev]
        paths:
            - 'app/**'
            - '.github/workflows/forge-deploy.yml'
    workflow_dispatch:
        inputs:
            environment:
                description: Forge environment to deploy
                type: choice
                required: true
                default: development
                options:
                    - development
                    - staging

permissions:
    contents: read

# Two Forge environments only. `dev` deploys to development automatically;
# staging is release-grade and therefore manual (workflow_dispatch) so a
# release is always a deliberate act. Forge `production` is intentionally
# unused — it forbids `forge logs` and `forge tunnel`, which staging allows.
env:
    FORGE_ENVIRONMENT: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.environment ||
        'development' }}

jobs:
    deploy:
        name:
            Deploy to ${{ github.event_name == 'workflow_dispatch' &&
            inputs.environment || 'development' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: read
        environment:
            name:
                ${{ github.event_name == 'workflow_dispatch' &&
                inputs.environment || 'development' }}
        concurrency:
            group:
                forge-${{ github.event_name == 'workflow_dispatch' &&
                inputs.environment || 'development' }}
            cancel-in-progress: false
        env:
            CI: 'true'
            FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
            FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
            JIRA_SITE: ${{ vars.JIRA_SITE }}
            # One name per value. The render script writes the deploy origins
            # into manifest.yml, while vite.config.ts injects the same values
            # into the Custom UI bundle so the two cannot disagree.
            SMISKI_API_BASE_URL: ${{ vars.SMISKI_API_BASE_URL }}
            SMISKI_API_VERSION: ${{ vars.SMISKI_API_VERSION || '1' }}
            LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
        defaults:
            run:
                working-directory: app

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4

            # app depends on the private @smiskinext/sdks-jira package on
            # GitHub Packages; configure auth before any pnpm install.
            # $HOME/.npmrc is absolute, so defaults.working-directory (app)
            # does not affect where it is written.
            - name: Configure GitHub Packages
              uses: ./.github/actions/configure-github-packages
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Get pnpm store directory
              id: pnpm-store
              run:
                  echo "STORE_PATH=$(pnpm store path --silent)" >>
                  "$GITHUB_OUTPUT"

            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
                  key:
                      ${{ runner.os }}-forge-pnpm-${{
                      hashFiles('app/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-forge-pnpm-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # smiski-ui imports @smiskinext/smiski-ts, an in-repo workspace
            # package whose dist/ is gitignored. Build it before typecheck/build.
            - name: Build Smiski TS SDK
              run: pnpm --filter @smiskinext/smiski-ts build

            - name: Validate deployment configuration
              shell: bash
              run: |
                  set -euo pipefail

                  # Fail before building when an environment is not configured.
                  # LiveKit API credentials are deliberately absent: room tokens
                  # are minted by the backend `meet` service, so the Forge app
                  # never holds them.
                  required_values=(
                    FORGE_EMAIL
                    FORGE_API_TOKEN
                    JIRA_SITE
                    SMISKI_API_BASE_URL
                    LIVEKIT_URL
                  )

                  for name in "${required_values[@]}"; do
                    if [[ -z "${!name:-}" ]]; then
                      echo "::error::$name is not configured for the $FORGE_ENVIRONMENT GitHub Environment."
                      exit 1
                    fi
                  done

            - name: Check app
              run: |
                  pnpm lint
                  pnpm typecheck
                  pnpm test
                  pnpm build

            # manifest.yml ships a placeholder baseUrl. Forge's server-side
            # pre-deployment check rejects unresolved ${...} in egress-reachable
            # fields, so the real origin is substituted into the file on disk
            # before any Forge command reads it. See app/scripts/render-manifest.js.
            - name: Render manifest
              run: pnpm manifest:render

            - name: Forge lint
              shell: bash
              run: |
                  set -euo pipefail

                  # Forge commands must run from the directory containing manifest.yml.
                  pwd
                  pnpm exec forge settings set usage-analytics false
                  pwd
                  pnpm exec forge lint

            - name: Deploy to Forge
              run: |
                  pwd
                  pnpm exec forge deploy \
                    --non-interactive \
                    --environment "$FORGE_ENVIRONMENT"

            - name: Install or upgrade on Jira
              shell: bash
              run: |
                  set -euo pipefail

                  forge_cli() {
                    # Keep stdout clean because `install list --json` is parsed below.
                    pwd >&2
                    pnpm exec forge "$@"
                  }

                  # Query first so a genuine upgrade error is never hidden by a
                  # fallback installation attempt.
                  installations="$(forge_cli install list --json)"

                  if jq -e \
                    --arg environment "$FORGE_ENVIRONMENT" \
                    --arg site "$JIRA_SITE" \
                    '
                      def normalize_site:
                        ascii_downcase
                        | sub("^https?://"; "")
                        | sub("/+$"; "");

                      any(
                        .[];
                        .environment == $environment
                        and (.site | normalize_site) == ($site | normalize_site)
                        and (.product | ascii_downcase | contains("jira"))
                      )
                    ' <<< "$installations" > /dev/null; then
                    forge_cli install \
                      --upgrade \
                      --confirm-scopes \
                      --non-interactive \
                      --site "$JIRA_SITE" \
                      --product Jira \
                      --environment "$FORGE_ENVIRONMENT"
                  else
                    forge_cli install \
                      --confirm-scopes \
                      --non-interactive \
                      --site "$JIRA_SITE" \
                      --product Jira \
                      --environment "$FORGE_ENVIRONMENT"
                  fi
