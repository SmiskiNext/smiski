name: Build

on:
    workflow_call:

permissions:
    contents: read

jobs:
    build:
        name: Build affected
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/setup

            - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

            - name: Run build on affected projects
              run: npx nx affected -t build

            - name: Coverage gate
              run: ./services/gradlew jacocoTestCoverageVerification

            - name: Generate JaCoCo report
              run: ./services/gradlew jacocoTestReport
              if: always()

            - name: Upload JaCoCo report
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: jacoco-reports
                  path: services/**/build/reports/jacoco/

            - name: OpenAPI drift check
              run: |
                  pnpm run openapi:generate
                  if ! git diff --exit-code -- 'services/**/openapi.yaml'; then
                    echo "::error::OpenAPI specs are out of date. Run 'pnpm run openapi' locally and commit the result."
                    exit 1
                  fi

            - name: OpenAPI lint
              run: pnpm run openapi:lint
