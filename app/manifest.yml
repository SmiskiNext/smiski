# Smiski — Forge app manifest
#
# Declares the two Custom UI surfaces for the embedded-meeting module:
#   1. jira:issuePanel — per-Issue quick access, rendered at the bottom of the
#      Jira issue view (new issue view only)
#   2. jira:projectPage — project-wide meeting management (dashboard + room)
#
# Both modules render the SAME Custom UI bundle (static/smiski-ui). The frontend
# branches on the Forge module context (moduleKey) to mount the correct root
# component. See static/smiski-ui/src/App.tsx.
#
# NOTE: There is no Forge resolver/function in this app. Meeting reads/
# mutations go straight from the Custom UI to the real `meet` backend via
# Forge Remote + a generated SDK; Jira-native operations (workspace user
# search, the View/Edit Meeting permission check, issue/project-member lookup)
# call Jira directly from the browser via `@forge/bridge`'s `requestJira`
# (Forge bridge v2+ supports this without a resolver hop) — see
# static/smiski-ui/src/api/.
#
# Backend calls use `invokeRemote`, which is proxied through the Forge platform
# and resolves its target through the invoking module's `resolver.endpoint`.
# The `resolver.endpoint: meet-endpoint` entries on both UI modules below are
# what bind them to the `endpoint` block. Adding a `resolver.endpoint`
# reference requires no resolver CODE — the app stays function-free.
#
# Egress is still partly client-side: the SSE event stream and LiveKit
# signalling leave the iframe directly, which is why
# `permissions.external.fetch.client` below still lists the backend remote.

modules:
    jira:issuePanel:
        - key: smiski-issue-panel
          resource: main
          resolver:
              endpoint: meet-endpoint
          title: Smiski Meetings
          icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg

    jira:projectPage:
        - key: smiski-project-page
          resource: main
          resolver:
              endpoint: meet-endpoint
          title: Smiski Meetings
          layout: blank
          icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg

    # Custom Jira project permissions (per app/PERMISSION.md): a 2-level
    # View/Edit model, Edit implying View. Once deployed, a Jira/Project Admin
    # assigns these to roles/groups/users via the project's Permission
    # Scheme UI — this app only declares them and reads them back
    # (`getMeetingPermission` in static/smiski-ui/src/api/meetingPermission.ts,
    # via `GET /rest/api/3/mypermissions`).
    jira:projectPermission:
        - key: view-meeting
          name: View Meeting
          description:
              View meeting info and history, view meeting detail, join a Running
              meeting, view recording if available.
          category: projects
        - key: edit-meeting
          name: Edit Meeting
          description:
              Create, schedule, start, edit, cancel, and end meetings;
              start/stop recording.
          category: projects

    # Forge Remote endpoint binding the `meet` backend remote.
    #
    # This entry is what `invokeRemote` resolves against: the chain is
    # UI module → resolver.endpoint → remote. Both UI modules above declare
    # `resolver.endpoint: meet-endpoint`, so their backend calls are proxied by
    # the Forge platform, which attaches BOTH the FIT and — because
    # `appSystemToken` is enabled below — the `x-forge-oauth-system` header.
    #
    # The system token is not optional: the Go authorization service reads
    # `x-forge-oauth-system` and fails closed with "missing system token"
    # (services/gateway/internal/authz/service.go) before calling Jira's
    # permission-check API. The app previously called the backend with
    # `requestRemote`, which goes browser → gateway directly and, per the Forge
    # docs, "does not include OAuth tokens, even if configured on the
    # endpoint" — so every authenticated route was denied.
    #
    # Editing this block is a BREAKING manifest change: `forge deploy` must be
    # followed by `forge install --upgrade` and administrators re-consent.
    #
    # `route.path` is intentionally absent: it is only required for backend
    # module endpoints, and UI-module remote paths are supplied per call.
    endpoint:
        - key: meet-endpoint
          remote: meet-backend
          auth:
              appUserToken:
                  enabled: false
              appSystemToken:
                  enabled: true

# The self-hosted `meet` backend, reached through Forge Remote so Atlassian
# attaches the FIT. `baseUrl` is the API gateway origin, interpolated from
# `SMISKI_API_BASE_URL` (declared under `environment.variables` below) — the
# Forge CLI substitutes it from the process environment while reading this
# file, for every command (`lint`, `deploy`, `tunnel`, ...).
#
# Pin `@forge/cli` to exactly `13.2.0` (app/package.json). 13.3.0+ added a
# server-side pre-deployment check that reads the manifest BEFORE variable
# substitution and rejects `${...}` in egress-reachable fields with
# `MANIFEST_INVALID_RULE` (Atlassian ECO-1694; fix pending upstream). Do not
# bump past 13.2.x until that ships.
#
# `operations` declares every purpose this backend serves:
#   - compute: required for invokeRemote/requestRemote to work at all
#   - storage: the backend PERSISTS meeting data in Postgres
#   - fetch:   the remote is referenced from permissions.external.fetch below
#
# `inScopeEUD: true` because the persisted rows include End-User Data:
# `meetings.organizer_email` / `organizer_display_name` and
# `meeting_invitees.email` / `display_name`
# (services/meet/src/main/resources/db/migration/B1.0.0__baseline.sql).
# Consequences, accepted deliberately: the app is ineligible for the Runs on
# Atlassian badge, and reaching PINNED data-residency status would additionally
# require region-specific baseUrl entries.
remotes:
    - key: meet-backend
      baseUrl: '${SMISKI_API_BASE_URL}'
      operations:
          - compute
          - storage
          - fetch
      storage:
          inScopeEUD: true

resources:
    # Single Vite build output shared by both modules.
    # `pnpm --filter smiski-ui build` emits to static/smiski-ui/dist
    #
    # `tunnel.port` makes `forge tunnel` bypass `path` and proxy to the Vite dev
    # server instead, so the app hot-reloads while still rendering inside a real
    # Jira module with a live Forge bridge. There is no standalone preview: the
    # UI reads its context from `view.getContext()` and renders an error without
    # it. Keep the port in sync with `static/smiski-ui/vite.config.ts`, which
    # pins the same value with `strictPort`.
    - key: main
      path: static/smiski-ui/dist
      tunnel:
          port: 5173

permissions:
    scopes:
        - read:jira-work
        - read:jira-user # current user (/myself) + assignable project member lookup
        - read:permission:jira # list/check custom View Meeting / Edit Meeting permissions
        - read:app-system-token # required by endpoint.auth.appSystemToken above
        # - read:app-user-token # TODO: enable alongside endpoint.auth.appUserToken
        # - read:me            # TODO: enable if we need the invoking user's identity/profile
        # - offline_access     # TODO: enable if the identity bridge needs refresh tokens

    # Ant Design injects its styles at runtime (CSS-in-JS), which Forge Custom UI
    # blocks by default. Allow inline styles so Ant Design renders under the
    # Forge content security policy. See design D6 (BREAKING — major upgrade).
    content:
        styles:
            - 'unsafe-inline'

    # Egress declared here is client-side (`connect-src` on the Custom UI
    # iframe). Backend SDK calls no longer need it — `invokeRemote` is proxied
    # by the Forge platform — but two paths still leave the iframe directly and
    # do:
    #   - the raw-fetch SSE stream (api/meetingEvents.ts, api/sseClient.ts),
    #     which cannot move to Forge Remote because Forge Remote buffers
    #     response bodies and cannot deliver `text/event-stream`
    #   - LiveKit signalling (room.connect in the meeting room)
    #
    # The gateway is referenced as `- remote: meet-backend` rather than repeated
    # as an address, so its origin has a single source of truth: the server
    # resolves the reference back to the remote's `baseUrl` and validates that
    # value. LiveKit is not a Forge remote (the browser dials it directly), so
    # it is interpolated straight from `LIVEKIT_URL` instead.
    external:
        fetch:
            client:
                - remote: meet-backend
                - address: '${LIVEKIT_URL}'

# Interpolated by the Forge CLI (`lint`/`deploy`/`tunnel`/...) from the process
# environment, into every `${...}` placeholder above. `default` keeps a fresh
# clone's `forge lint` usable without any env set; real deployments must
# export real values (`.env`, CI environment `vars`) before invoking Forge.
#
# `static/smiski-ui/vite.config.ts` reads the same two names — plus
# `SMISKI_API_VERSION`, which only the bundle uses — into the Custom UI build,
# so the manifest's declared egress and the origins the frontend calls can
# never drift apart.
environment:
    variables:
        - key: SMISKI_API_BASE_URL
          default: 'https://set-smiski-api-base-url.invalid'
        - key: LIVEKIT_URL
          default: 'wss://smiski-meeting-2rcpqikr.livekit.cloud'

app:
    runtime:
        name: nodejs24.x
        memoryMB: 256
        architecture: arm64
    id: ari:cloud:ecosystem::app/5e00d851-2813-4c0b-b447-c4fd5ba7b150
