# Smiski — Forge app manifest
#
# Declares the two Custom UI surfaces for the embedded-meeting module:
#   1. jira:issuePanel — per-Issue quick access, rendered at the bottom of the
#      Jira issue view (new issue view only)
#   2. jira:projectPage — project-wide meeting management (dashboard + room)
#
# Both modules render the SAME Custom UI bundle (static/smiski-ui). The frontend
# branches on the Forge module context (moduleKey) to mount the correct root
# component. See static/smiski-ui/src/App.tsx.
#
# NOTE: There is no Forge resolver/function in this app. Meeting reads/
# mutations go straight from the Custom UI to the real `meet` backend via
# Forge Remote + a generated SDK; Jira-native operations (workspace user
# search, the View/Edit Meeting permission check, issue/project-member lookup)
# call Jira directly from the browser via `@forge/bridge`'s `requestJira`
# (Forge bridge v2+ supports this without a resolver hop) — see
# static/smiski-ui/src/api/.
#
# Because there is no function, ALL egress is client-side: see the
# `permissions.external.fetch.client` note below for why `fetch.backend` is
# absent, and the `endpoint` note for why `appSystemToken` does not reach the
# gateway under `requestRemote`.

modules:
    jira:issuePanel:
        - key: smiski-issue-panel
          resource: main
          title: Smiski Meetings
          icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg

    jira:projectPage:
        - key: smiski-project-page
          resource: main
          title: Smiski Meetings
          layout: blank
          icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg

    # Custom Jira project permissions (per app/PERMISSION.md): a 2-level
    # View/Edit model, Edit implying View. Once deployed, a Jira/Project Admin
    # assigns these to roles/groups/users via the project's Permission
    # Scheme UI — this app only declares them and reads them back
    # (`getMeetingPermission` in static/smiski-ui/src/api/meetingPermission.ts,
    # via `GET /rest/api/3/mypermissions`).
    jira:projectPermission:
        - key: view-meeting
          name: View Meeting
          description:
              View meeting info and history, view meeting detail, join a Running
              meeting, view recording if available.
          category: projects
        - key: edit-meeting
          name: Edit Meeting
          description:
              Create, schedule, start, edit, cancel, and end meetings;
              start/stop recording.
          category: projects

    # Forge Remote endpoint binding the `meet` backend remote.
    #
    # This entry only takes effect for module invocations that route THROUGH the
    # Forge platform — i.e. `invokeRemote` from a module wired via
    # `resolver.endpoint`, or a trigger. The Custom UI currently calls the
    # backend with `requestRemote` (static/smiski-ui/src/api/forgeRemoteFetch.ts),
    # which goes browser → gateway directly and, per the Forge docs, "does not
    # include OAuth tokens, even if configured on the endpoint". So today only
    # the FIT reaches the gateway and `appSystemToken` below is inert.
    #
    # It is declared enabled anyway because the gateway REQUIRES it: the Go
    # authorization service reads `x-forge-oauth-system` and fails closed with
    # "missing system token" (services/gateway/internal/authz/service.go:105)
    # before calling Jira's permission-check API. Until the transport moves to
    # `invokeRemote`, every authenticated route is denied — see the
    # `requestRemote` note in app/AGENTS.md.
    #
    # `route.path` is intentionally absent: it is only required for backend
    # module endpoints, and UI-module remote paths are supplied per call.
    endpoint:
        - key: meet-endpoint
          remote: meet-backend
          auth:
              appUserToken:
                  enabled: false
              appSystemToken:
                  enabled: true

# The self-hosted `meet` backend, reached through Forge Remote so Atlassian
# attaches the FIT. `baseUrl` is the API gateway origin.
#
# NOTE the literal URL. This file previously used `${SMISKI_API_BASE_URL}` here,
# which is a documented manifest-variable feature and passes every local
# validator — but Forge's SERVER-SIDE check rejects it:
#
#   Invalid URL detected for EGRESS permissions object:
#   ${SMISKI_API_BASE_URL}, ${SMISKI_API_BASE_URL}   MANIFEST_INVALID_RULE
#
# The variable is reported TWICE for this single occurrence, because the server
# also resolves the `- remote: meet-backend` egress reference below back to this
# same `baseUrl`. So neither the `- remote:` indirection nor `baseUrl` itself
# escapes the check: the manifest ON DISK must already contain a real URL by the
# time the Forge CLI reads it.
#
# `scripts/render-manifest.sh` does that substitution from
# `SMISKI_API_BASE_URL`. `pnpm run deploy` and `pnpm run install:site` invoke it
# first; a bare `pnpm run forge <cmd>` does NOT, so run `pnpm manifest:render`
# by hand before `forge lint`/`forge deploy`. The committed placeholder is a
# syntactically valid `.invalid` origin on purpose, so `forge lint` still passes
# on a fresh clone — but it resolves nowhere, so an unrendered deploy fails fast
# instead of silently pointing at the wrong gateway. Never commit a rendered
# manifest; `git checkout app/manifest.yml` puts the placeholder back.
#
# `operations` declares every purpose this backend serves:
#   - compute: required for invokeRemote/requestRemote to work at all
#   - storage: the backend PERSISTS meeting data in Postgres
#   - fetch:   the remote is referenced from permissions.external.fetch below
#
# `inScopeEUD: true` because the persisted rows include End-User Data:
# `meetings.organizer_email` / `organizer_display_name` and
# `meeting_invitees.email` / `display_name`
# (services/meet/src/main/resources/db/migration/B1.0.0__baseline.sql).
# Consequences, accepted deliberately: the app is ineligible for the Runs on
# Atlassian badge, and reaching PINNED data-residency status would additionally
# require region-specific baseUrl entries.
remotes:
    - key: meet-backend
      baseUrl: 'https://render-manifest-not-run.invalid'
      operations:
          - compute
          - storage
          - fetch
      storage:
          inScopeEUD: true

resources:
    # Single Vite build output shared by both modules.
    # `pnpm --filter smiski-ui build` emits to static/smiski-ui/dist
    - key: main
      path: static/smiski-ui/dist

permissions:
    scopes:
        - read:jira-work
        - read:jira-user # current user (/myself) + assignable project member lookup
        - read:permission:jira # list/check custom View Meeting / Edit Meeting permissions
        - read:app-system-token # required by endpoint.auth.appSystemToken above
        # - read:app-user-token # TODO: enable alongside endpoint.auth.appUserToken
        # - read:me            # TODO: enable if we need the invoking user's identity/profile
        # - offline_access     # TODO: enable if the identity bridge needs refresh tokens

    # Ant Design injects its styles at runtime (CSS-in-JS), which Forge Custom UI
    # blocks by default. Allow inline styles so Ant Design renders under the
    # Forge content security policy. See design D6 (BREAKING — major upgrade).
    content:
        styles:
            - 'unsafe-inline'

    # Egress is client-side only: this app has NO Forge function or resolver, and
    # `requestRemote` is not proxied through the platform, so all backend traffic
    # leaves the Custom UI iframe and needs `connect-src` (fetch.client) rather
    # than fetch.backend. Covered here:
    #   - requestRemote      (api/forgeRemoteFetch.ts)
    #   - the raw-fetch SSE stream (api/meetingEvents.ts, api/sseClient.ts)
    #   - LiveKit signalling (room.connect in the meeting room)
    #
    # The gateway is referenced as `- remote: meet-backend` rather than repeated
    # as an address, so its origin has a single source of truth. This does NOT
    # dodge the server-side egress check — the server resolves the reference back
    # to the remote's `baseUrl` and validates that — which is why `baseUrl` above
    # must already be a real URL. LiveKit is not a Forge remote (the browser
    # dials it directly), so it is a concrete wss:// origin.
    external:
        fetch:
            client:
                - remote: meet-backend
                - address: 'wss://smiski-meeting-2rcpqikr.livekit.cloud'

# No `environment.variables` block: nothing in this manifest is interpolated by
# the Forge CLI any more. Both deployment origins are literal, because Forge's
# server-side egress check rejects `${...}` in `remotes[].baseUrl` and in
# anything reachable from `permissions.external.fetch` (see the remotes note).
#
# Per-environment values are therefore applied by rewriting the file before the
# CLI runs — `scripts/render-manifest.sh`, driven by `SMISKI_API_BASE_URL`.
# `static/smiski-ui/vite.config.ts` still reads SMISKI_API_BASE_URL and
# LIVEKIT_URL into the bundle from the same environment, so keep the LiveKit
# address above in sync with LIVEKIT_URL by hand or signalling is CSP-blocked.

app:
    runtime:
        name: nodejs24.x
        memoryMB: 256
        architecture: arm64
    id: ari:cloud:ecosystem::app/5e00d851-2813-4c0b-b447-c4fd5ba7b150
