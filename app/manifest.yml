# Smiski — Forge app manifest
#
# Declares the two Custom UI surfaces for the embedded-meeting module:
#   1. jira:issuePanel — per-Issue quick access, rendered at the bottom of the
#      Jira issue view (new issue view only)
#   2. jira:projectPage — project-wide meeting management (dashboard + room)
#
# Both modules render the SAME Custom UI bundle (static/smiski-ui). The frontend
# branches on the Forge module context (moduleKey) to mount the correct root
# component. See static/smiski-ui/src/App.tsx.
#
# NOTE: Meeting reads/mutations go straight from the Custom UI to the real
# `meet` backend via Forge Remote + a generated SDK — the resolver
# (src/index.ts) only handles Jira-native operations (workspace user search,
# the View/Edit Meeting permission check) plus two operations the backend
# doesn't support yet (project-wide listing, explicit "end meeting").

modules:
    jira:issuePanel:
        - key: smiski-issue-panel
          resource: main
          resolver:
              function: resolver
          title: Smiski Meetings
          icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg

    jira:projectPage:
        - key: smiski-project-page
          resource: main
          resolver:
              function: resolver
          title: Smiski Meetings
          layout: blank
          icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg

    # Custom Jira project permissions (per app/PERMISSION.md): a 2-level
    # View/Edit model, Edit implying View. Once deployed, a Jira/Project Admin
    # assigns these to roles/groups/users via the project's Permission
    # Scheme UI — this app only declares them and reads them back
    # (`getMeetingPermission` in src/index.ts, via `GET /rest/api/3/mypermissions`).
    jira:projectPermission:
        - key: view-meeting
          name: View Meeting
          description:
              View meeting info and history, view meeting detail, join a Running
              meeting, view recording if available.
          category: projects
        - key: edit-meeting
          name: Edit Meeting
          description:
              Create, schedule, start, edit, cancel, and end meetings;
              start/stop recording.
          category: projects

    function:
        - key: resolver
          handler: index.handler

    # Forge Remote endpoint binding the `meet` backend remote. Forge attaches a
    # signed Forge Invocation Token (FIT) as `Authorization: Bearer` on every
    # requestRemote call to this remote; the app itself asserts no tenant/account
    # identity. `route.path` mirrors the backend path the Custom UI calls (see
    # static/smiski-ui/src/api/meetings.ts). OAuth token flags stay disabled:
    # requestRemote delivers only the FIT, and deriving tenant/account identity
    # from it is the gateway's responsibility (deferred). Enable appUserToken
    # later — with the read:app-user-token scope — if the backend must call Jira
    # APIs on the user's behalf.
    endpoint:
        - key: meet-endpoint
          remote: meet-backend
          route:
              path: /api/1/meetings:instant
          auth:
              appUserToken:
                  enabled: false
              appSystemToken:
                  enabled: false

# The self-hosted `meet` backend, reached through Forge Remote so Atlassian
# attaches the FIT. `baseUrl` is the API gateway origin — the SAME env-var as
# permissions.external.fetch.backend below, resolved by the CI/CD workflow per
# Forge environment. `operations: [compute]` is required to call the remote; no
# End-User Data is stored on the remote.
remotes:
    - key: meet-backend
      baseUrl: '${SMISKI_API_BASE_URL}'
      operations:
          - compute
      storage:
          inScopeEUD: false

resources:
    # Single Vite build output shared by both modules.
    # `pnpm --filter smiski-ui build` emits to static/smiski-ui/dist
    - key: main
      path: static/smiski-ui/dist

permissions:
    scopes:
        - read:jira-work
        - read:jira-user # current user (/myself) + assignable project member lookup
        - read:permission:jira # list/check custom View Meeting / Edit Meeting permissions
        # - read:me            # TODO: enable if we need the invoking user's identity/profile
        # - offline_access     # TODO: enable if the identity bridge needs refresh tokens

    # Ant Design injects its styles at runtime (CSS-in-JS), which Forge Custom UI
    # blocks by default. Allow inline styles so Ant Design renders under the
    # Forge content security policy. See design D6 (BREAKING — major upgrade).
    content:
        styles:
            - 'unsafe-inline'

    # The app talks to backend APIs only through the Caddy gateway. `backend`
    # covers Forge resolver fetches and MUST match remotes[meet-backend].baseUrl
    # above so Forge permits the outbound requestRemote call; `client` covers
    # Custom UI fetch/WebSocket traffic required by the LiveKit client in the
    # meeting room. The CI/CD workflow supplies the gateway for each environment.
    external:
        fetch:
            backend:
                - address: '${SMISKI_API_BASE_URL}' # Caddy API gateway == remotes[meet-backend].baseUrl
            client:
                - address: '${SMISKI_API_BASE_URL}' # meeting/token endpoints
                - address: '${LIVEKIT_URL}' # LiveKit signalling

# These values are resolved by the Forge CLI while it reads the manifest. The
# defaults keep local linting usable; deployments must provide real values.
environment:
    variables:
        - key: SMISKI_API_BASE_URL
          default: 'https://TODO-caddy-gateway.smiski.example'
        - key: LIVEKIT_URL
          default: 'wss://smiski-meeting-2rcpqikr.livekit.cloud'

app:
    runtime:
        name: nodejs24.x
        memoryMB: 256
        architecture: arm64
    id: ari:cloud:ecosystem::app/5e00d851-2813-4c0b-b447-c4fd5ba7b150
