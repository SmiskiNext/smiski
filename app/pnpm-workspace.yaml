# pnpm workspace root for the Smiski Forge app.
#
# Members:
#   - .                  -> Forge app root (resolver/backend + Forge CLI)
#   - static/smiski-ui   -> Vite + React + TS Custom UI frontend
#   - ../sdks/typescript -> @smiskinext/smiski-ts (in-repo, unpublished; linked
#                           so the isolated app workspace can resolve workspace:*)
packages:
    - 'static/*'
    - '../sdks/typescript'

# Allow only these dependencies to run install/build scripts.
# esbuild needs its postinstall to fetch the platform binary for `vite build`.
onlyBuiltDependencies:
    - esbuild
