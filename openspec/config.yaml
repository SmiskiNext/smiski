schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
context: |
    Domain: Enterprise
    Proposal: Develop a production-ready, scalable, maintainable, and secure Jira Forge App + Backend by Forge remote
    Tech stack:
    - Services: Spring Boot, Java 25
    - App: ReactJs, TypeScript, Antd

rules:
    design:
        - Read openspec/specs/api-convention/spec.md before making API decisions
        - Read openspec/specs/db-schema/spec.md before proposing schema changes
        - Include sequence diagrams (mermaid) for any flow with 3+ components
          involved
    specs:
        - Every requirement MUST have at least one scenario covering
          failure/edge case
        - MUST reference existing patterns in `openspec list --specs` before
          inventing new ones
        - Do not describe implementation details — specs describe behavior, not
          code
    tasks:
        - Derive test tasks from spec scenarios (Given/When/Then), not from
          individual code diffs
        - One test task per scenario/acceptance criterion, not per file or
          function changed
        - Skip test tasks for scenarios already covered by existing tests —
          reference the existing test instead of duplicating
        - Group test tasks separately from implementation tasks so reviewers can
          see test coverage at a glance
        - For bug-fix changes, always include a regression test task even if
          other rules would skip testing
# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
