pre-commit:
    parallel: false
    commands:
        gitleaks:
            run: >
                command -v gitleaks >/dev/null 2>&1 && gitleaks protect --staged
                --config .gitleaks.toml || echo "[gitleaks] not found, skipping
                (install via: https://github.com/gitleaks/gitleaks)"

        format-java:
            glob: 'services/**/*.{java,kts,xml}'
            exclude:
                - 'services/**/.idea/**'
                - 'services/**/.gradle/**'
            run: >
                ./services/gradlew spotlessApply -PspotlessFiles="$(echo
                {staged_files} | tr ' ' ',')"
            stage_fixed: true

        format-proto:
            root: services/proto
            glob: '**/*.proto'
            run: >
                for f in {staged_files}; do buf format -w --path "$f"; done
            stage_fixed: true

        format-general:
            glob: '**/*.{md,json,toml,yaml,yml,sh,sql}'
            exclude:
                - 'jira-client/**'
            run: >
                pnpm exec prettier --write {staged_files}
            stage_fixed: true

        lint-markdown:
            glob: '**/*.md'
            run: >
                pnpm exec markdownlint-cli2 --fix {staged_files}
            stage_fixed: true

        format-scripts:
            root: scripts
            glob: '**/*.{ts,js}'
            run: >
                pnpm biome check --write --no-errors-on-unmatched
                --files-ignore-unknown=true {staged_files}
            stage_fixed: true

        format-app:
            root: app
            glob: 'app/src/**/*.{js,jsx,ts,tsx,json}'
            run: >
                pnpm exec prettier --write {staged_files} && pnpm exec eslint
                --fix --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true

commit-msg:
    commands:
        commitlint:
            run: node_modules/.bin/commitlint --edit {1}

pre-push:
    parallel: false
    commands:
        block-main:
            priority: 1
            run: >
                branch="$(git rev-parse --abbrev-ref HEAD)"; if [ "$branch" =
                "main" ]; then echo "[block-main] direct push to 'main' is not
                allowed"; exit 1; fi

        gitleaks:
            priority: 2
            run: >
                command -v gitleaks >/dev/null 2>&1 && gitleaks detect --config
                .gitleaks.toml || echo "[gitleaks] not found, skipping (install
                via: https://github.com/gitleaks/gitleaks)"

        typecheck-scripts:
            priority: 3
            root: scripts
            run: pnpm exec tsc --noEmit

        typecheck-app:
            priority: 3
            root: app
            run: pnpm exec tsc --noEmit

        assemble-java:
            priority: 3
            glob: 'services/**/*.java'
            run: >
                svcs=$(for f in {push_files}; do case "$f" in services/*/*) echo
                "$(echo "$f" | cut -d/ -f2)" ;; esac; done | sort -u); [ -z
                "$svcs" ] && exit 0; for s in $svcs; do ./services/gradlew -p
                "services/$s" assemble || exit 1; done

        openapi-drift:
            priority: 4
            glob: 'services/{tenant,meet,notification}/**'
            run: >
                svcs=$(for f in {push_files}; do case "$f" in services/tenant/*)
                echo tenant ;; services/meet/*) echo meet ;;
                services/notification/*) echo notification ;; esac; done | sort
                -u); [ -z "$svcs" ] && exit 0; rc=0; for s in $svcs; do
                spec="services/$s/openapi.yaml"; backup="$(mktemp)"; cp "$spec"
                "$backup"; if ! ./services/gradlew -p "services/$s"
                generateOpenApiDocsFromTests; then cp "$backup" "$spec"; rm -f
                "$backup"; exit 1; fi; if ! diff -q "$backup" "$spec"
                >/dev/null; then echo "[openapi-drift] $spec is out of date.
                Run: pnpm run openapi:$s and commit the regenerated spec.";
                rc=1; fi; cp "$backup" "$spec"; rm -f "$backup"; done; exit $rc

        openapi-merge-drift:
            priority: 4
            glob: 'services/{tenant,meet,notification}/**'
            run: >
                svcs=$(for f in {push_files}; do case "$f" in services/tenant/*)
                echo tenant ;; services/meet/*) echo meet ;;
                services/notification/*) echo notification ;; esac; done | sort
                -u); [ -z "$svcs" ] && exit 0; rc=0;
                spec="services/openapi.yaml"; backup="$(mktemp)"; cp "$spec"
                "$backup"; if ! pnpm run openapi:join; then cp "$backup"
                "$spec"; rm -f "$backup"; exit 1; fi; if ! diff -q "$backup"
                "$spec" >/dev/null; then echo "[openapi-merge-drift] $spec is
                out of date. Run: pnpm run openapi and commit the regenerated
                combined spec."; rc=1; fi; cp "$backup" "$spec"; rm -f
                "$backup"; exit $rc
